<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Leaderboard — Middle Eastern Mixing</title>

  <link rel="icon" href="/logo.gif">

  <style>
    :root {
      --black: #0b0a08;
      --black-2: #12100d;
      --black-3: #191611;

      --surface: #191611;
      --surface-2: #211d17;
      --surface-3: #29231c;

      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);

      --text: #f5f1e8;
      --text-2: #aaa398;
      --text-3: #746e65;

      --accent: #d7a84f;
      --success: #68c18a;
      --danger: #d96c6c;

      --radius: 14px;
    }


    * {
      box-sizing: border-box;
    }


    html {
      min-height: 100%;
      background: var(--black);
    }


    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(215,168,79,0.08),
          transparent 35%
        ),
        var(--black);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {
      position: sticky;
      top: 0;
      z-index: 100;

      height: 70px;

      background: rgba(11,10,8,0.92);

      backdrop-filter: blur(16px);

      border-bottom: 1px solid var(--border);
    }


    .header-inner {
      width: min(1200px, calc(100% - 40px));

      height: 100%;

      margin: 0 auto;

      display: flex;
      align-items: center;
      gap: 24px;
    }


    .brand {
      display: flex;
      align-items: center;
      gap: 11px;

      font-weight: 800;

      white-space: nowrap;
    }


    .brand img {
      width: 34px;
      height: 34px;

      border-radius: 9px;

      object-fit: cover;
    }


    .brand span {
      font-size: 15px;
    }


    .nav {
      display: flex;
      align-items: center;

      gap: 5px;

      margin-left: auto;
    }


    .nav-link {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 9px 12px;

      color: var(--text-2);

      border-radius: 9px;

      font-size: 13px;
      font-weight: 600;

      transition:
        color .15s ease,
        background .15s ease;
    }


    .nav-link:hover {
      color: var(--text);

      background:
        rgba(255,255,255,0.05);
    }


    .nav-link.active {
      color: var(--accent);

      background:
        rgba(215,168,79,0.08);
    }


    .nav-link svg {
      width: 16px;
      height: 16px;
    }


    .account {
      display: flex;
      align-items: center;
      gap: 10px;
    }


    .balance {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 8px 11px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 9px;

      font-size: 13px;
      font-weight: 700;
    }


    .coin {
      color: var(--accent);
    }


    .login {
      padding: 9px 13px;

      border-radius: 9px;

      background: var(--accent);
      color: #17120a;

      font-size: 13px;
      font-weight: 800;
    }


    .user-button {
      display: none;

      align-items: center;
      gap: 8px;

      padding: 4px 9px 4px 4px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 10px;
    }


    .user-button img {
      width: 29px;
      height: 29px;

      border-radius: 8px;

      object-fit: cover;
    }


    .user-name {
      max-width: 100px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 12px;
      font-weight: 700;
    }


    /* ==========================================
       PAGE
    ========================================== */

    .page {
      width: min(1000px, calc(100% - 40px));

      margin: 0 auto;

      padding: 54px 0 70px;
    }


    .page-header {
      margin-bottom: 30px;
    }


    .eyebrow {
      margin-bottom: 9px;

      color: var(--accent);

      font-size: 11px;
      font-weight: 800;

      letter-spacing: .13em;
      text-transform: uppercase;
    }


    h1 {
      margin: 0;

      font-size: clamp(30px, 5vw, 44px);

      line-height: 1.05;

      letter-spacing: -0.035em;
    }


    .description {
      max-width: 650px;

      margin: 13px 0 0;

      color: var(--text-2);

      font-size: 15px;
      line-height: 1.7;
    }


    /* ==========================================
       LEADERBOARD
    ========================================== */

    .leaderboard {
      overflow: hidden;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);
    }


    .leaderboard-header {
      display: grid;

      grid-template-columns:
        70px
        minmax(220px, 1fr)
        150px
        120px
        120px;

      align-items: center;

      min-height: 50px;

      padding: 0 20px;

      background:
        rgba(255,255,255,0.025);

      border-bottom: 1px solid var(--border);

      color: var(--text-3);

      font-size: 10px;
      font-weight: 800;

      letter-spacing: .08em;
      text-transform: uppercase;
    }


    .player-row {
      display: grid;

      grid-template-columns:
        70px
        minmax(220px, 1fr)
        150px
        120px
        120px;

      align-items: center;

      min-height: 76px;

      padding: 0 20px;

      border-bottom: 1px solid var(--border);

      transition:
        background .15s ease;
    }


    .player-row:last-child {
      border-bottom: 0;
    }


    .player-row:hover {
      background:
        rgba(255,255,255,0.025);
    }


    .rank {
      color: var(--text-3);

      font-size: 14px;
      font-weight: 800;
    }


    .rank.top {
      color: var(--accent);

      font-size: 16px;
    }


    .player {
      display: flex;
      align-items: center;
      gap: 12px;

      min-width: 0;
    }


    .avatar {
      width: 40px;
      height: 40px;

      flex-shrink: 0;

      border-radius: 11px;

      background: var(--surface-3);

      border: 1px solid var(--border);

      object-fit: cover;
    }


    .avatar-placeholder {
      display: grid;
      place-items: center;

      color: var(--text-2);

      font-size: 15px;
      font-weight: 800;
    }


    .player-info {
      min-width: 0;

      display: flex;
      align-items: center;
      gap: 7px;
    }


    .player-text {
      min-width: 0;
    }


    .player-name {
      overflow: hidden;

      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 13px;
      font-weight: 800;
    }


    .player-sub {
      margin-top: 3px;

      color: var(--text-3);

      font-size: 10px;
    }


    /* ==========================================
       STAFF BADGE
    ========================================== */

    .leaderboard-staff-badge {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(
          0 0 9px
          rgba(215,168,79,0.22)
        )
        drop-shadow(
          0 4px 10px
          rgba(0,0,0,0.30)
        );
    }


    .value {
      font-size: 13px;
      font-weight: 700;
    }


    .balance-value {
      color: var(--accent);
    }


    .muted-value {
      color: var(--text-2);
    }


    /* ==========================================
       LOADING
    ========================================== */

    .loading {
      padding: 55px 20px;

      color: var(--text-2);

      text-align: center;

      font-size: 13px;
    }


    .error {
      padding: 45px 20px;

      color: var(--danger);

      text-align: center;

      font-size: 13px;
    }


    .empty {
      padding: 55px 20px;

      color: var(--text-3);

      text-align: center;

      font-size: 13px;
    }


    /* ==========================================
       FOOTER
    ========================================== */

    .footer {
      width: min(1000px, calc(100% - 40px));

      margin: 0 auto;

      padding: 24px 0 35px;

      border-top: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      color: var(--text-3);

      font-size: 11px;
    }


    .footer-links {
      display: flex;
      gap: 18px;
    }


    .footer-links a:hover {
      color: var(--text-2);
    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 800px) {

      .leaderboard-header {
        display: none;
      }


      .player-row {
        grid-template-columns:
          45px
          minmax(0, 1fr)
          auto;

        gap: 10px;

        padding: 13px 15px;

        min-height: 68px;
      }


      .player-row > .games,
      .player-row > .rating {
        display: none;
      }


      .balance-column {
        text-align: right;
      }


      .nav-link span {
        display: none;
      }


      .nav-link {
        padding: 9px;
      }

    }


    @media (max-width: 600px) {

      .header-inner,
      .page,
      .footer {
        width: calc(100% - 28px);
      }


      .header {
        height: 62px;
      }


      .brand span {
        display: none;
      }


      .balance {
        display: none;
      }


      .page {
        padding-top: 38px;
      }


      .leaderboard-staff-badge {
        width: 36px;
        height: 36px;
      }


      .footer {
        align-items: flex-start;

        flex-direction: column;

        gap: 12px;
      }

    }
  </style>
</head>


<body>


  <!-- ==========================================
       HEADER
  ========================================== -->

  <header class="header">

    <div class="header-inner">


      <a
        href="/"
        class="brand"
      >

        <img
          src="/logo.gif"
          alt="Middle Eastern Mixing"
        >

        <span>
          Middle Eastern Mixing
        </span>

      </a>


      <nav class="nav">


        <a
          href="/games"
          class="nav-link"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <rect
              x="3"
              y="6"
              width="18"
              height="12"
              rx="3"
            />

            <path d="M8 10v4M6 12h4" />

            <circle
              cx="16.5"
              cy="11"
              r="1"
            />

            <circle
              cx="18.5"
              cy="13"
              r="1"
            />

          </svg>

          <span>
            Games
          </span>

        </a>


        <a
          href="/leaderboard"
          class="nav-link active"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <path d="M8 21h8" />

            <path d="M12 17v4" />

            <path
              d="M7 4h10v5a5 5 0 0 1-10 0V4Z"
            />

            <path
              d="M7 7H4v1a4 4 0 0 0 4 4"
            />

            <path
              d="M17 7h3v1a4 4 0 0 1-4 4"
            />

          </svg>

          <span>
            Leaderboard
          </span>

        </a>


        <a
          href="/shop"
          class="nav-link"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <path d="M6 8h12l1 12H5L6 8Z" />

            <path d="M9 8a3 3 0 0 1 6 0" />

          </svg>

          <span>
            Shop
          </span>

        </a>


        <a
          href="/inventory"
          class="nav-link"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >

            <rect
              x="3"
              y="5"
              width="18"
              height="16"
              rx="3"
            />

            <path d="M8 5V3h8v2" />

            <path d="M8 11h8" />

            <path d="M8 15h5" />

          </svg>

          <span>
            Inventory
          </span>

        </a>

      </nav>


      <div class="account">


        <div
          id="balance"
          class="balance"
        >

          <span class="coin">
            ◆
          </span>

          <span id="balanceValue">
            —
          </span>

        </div>


        <a
          id="loginButton"
          class="login"
          href="https://api.memplace.xyz/api/auth/login"
        >
          Login
        </a>


        <a
          id="userButton"
          class="user-button"
          href="/profile"
        >

          <img
            id="userAvatar"
            src=""
            alt=""
          >

          <span
            id="userName"
            class="user-name"
          >
            —
          </span>

        </a>


      </div>

    </div>

  </header>


  <!-- ==========================================
       MAIN
  ========================================== -->

  <main class="page">


    <section class="page-header">

      <div class="eyebrow">
        Middle Eastern Mixing
      </div>


      <h1>
        Leaderboard
      </h1>


      <p class="description">
        See who's leading the table by balance,
        games played, and chess rating.
      </p>

    </section>


    <section
      id="leaderboard"
      class="leaderboard"
    >


      <div class="leaderboard-header">

        <div>
          Rank
        </div>


        <div>
          Player
        </div>


        <div>
          Balance
        </div>


        <div>
          Games
        </div>


        <div>
          Chess
        </div>

      </div>


      <div id="leaderboardContent">

        <div class="loading">
          Loading leaderboard...
        </div>

      </div>


    </section>

  </main>


  <!-- ==========================================
       FOOTER
  ========================================== -->

  <footer class="footer">

    <span>
      © 2026 Middle Eastern Mixing
    </span>


    <div class="footer-links">

      <a href="/terms">
        Terms
      </a>


      <a href="/privacy">
        Privacy
      </a>


      <a href="/support">
        Support
      </a>

    </div>

  </footer>


  <script>

    const API_URL =
      "https://api.memplace.xyz";


    /* ==========================================
       LOAD CURRENT USER
    ========================================== */

    async function loadCurrentUser() {

      try {

        const response =
          await fetch(
            API_URL + "/api/user/me",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          document
            .getElementById("loginButton")
            .style.display =
              "block";

          return;

        }


        const data =
          await response.json();


        if (
          !data.success ||
          !data.authenticated ||
          !data.user
        ) {

          return;

        }


        const user =
          data.user;


        document
          .getElementById("loginButton")
          .style.display =
            "none";


        document
          .getElementById("userButton")
          .style.display =
            "flex";


        document
          .getElementById("userName")
          .textContent =
            user.username ||
            user.discordUsername ||
            "User";


        document
          .getElementById("balanceValue")
          .textContent =
            Number(
              user.balance || 0
            ).toLocaleString();


        if (
          user.id &&
          user.avatar
        ) {

          document
            .getElementById("userAvatar")
            .src =
              "https://cdn.discordapp.com/avatars/" +
              encodeURIComponent(user.id) +
              "/" +
              encodeURIComponent(user.avatar) +
              ".png?size=64";

        }

      } catch (error) {

        console.error(
          "USER LOAD ERROR:",
          error
        );

      }

    }


    /* ==========================================
       LOAD LEADERBOARD
    ========================================== */

    async function loadLeaderboard() {

      const container =
        document.getElementById(
          "leaderboardContent"
        );


      try {

        const response =
          await fetch(
            API_URL + "/api/leaderboard",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Failed to load leaderboard."
          );

        }


        const players =
          Array.isArray(
            data.leaderboard
          )
            ? data.leaderboard
            : [];


        if (!players.length) {

          container.innerHTML = `
            <div class="empty">
              No players have joined the leaderboard yet.
            </div>
          `;

          return;

        }


        container.innerHTML =
          players
            .map(
              player =>
                renderPlayer(
                  player
                )
            )
            .join("");


      } catch (error) {

        console.error(
          "LEADERBOARD LOAD ERROR:",
          error
        );


        container.innerHTML = `
          <div class="error">
            Failed to load leaderboard.
          </div>
        `;

      }

    }


    /* ==========================================
       RENDER PLAYER
    ========================================== */

    function renderPlayer(player) {

      const rank =
        Number(
          player.rank || 0
        );


      const username =
        escapeHtml(
          player.username ||
          "Unknown User"
        );


      const games =
        Number(
          player.gamesPlayed || 0
        );


      const balance =
        Number(
          player.balance || 0
        ).toLocaleString();


      const chessRating =
        Number(
          player.chessRating || 1200
        );


      /* ==========================================
         AVATAR
      ========================================== */

      let avatar;


      if (
        player.id &&
        player.avatar
      ) {

        avatar = `

          <img
            class="avatar"
            src="https://cdn.discordapp.com/avatars/${encodeURIComponent(player.id)}/${encodeURIComponent(player.avatar)}.png?size=80"
            alt=""
            loading="lazy"
          >

        `;

      } else {

        avatar = `

          <div
            class="avatar avatar-placeholder"
          >

            ${escapeHtml(
              username
                .charAt(0)
                .toUpperCase()
            )}

          </div>

        `;

      }


      /* ==========================================
         STAFF BADGE
      ========================================== */

      const staffBadgeHtml =
        player.isStaff

          ? `

            <img
              class="leaderboard-staff-badge"
              src="/staffbadge.png"
              alt="Staff"
              title="${
                player.staffRole
                  ? escapeHtml(
                      player.staffRole
                        .charAt(0)
                        .toUpperCase() +
                      player.staffRole.slice(1)
                    )
                  : "Staff"
              }"
              loading="lazy"
            >

          `

          : "";


      return `

        <div class="player-row">


          <div
            class="rank ${
              rank <= 3
                ? "top"
                : ""
            }"
          >
            #${rank}
          </div>


          <div class="player">


            ${avatar}


            <div class="player-info">


              <div class="player-text">

                <div class="player-name">
                  ${username}
                </div>


                <div class="player-sub">

                  ${games}

                  ${
                    games === 1
                      ? "game"
                      : "games"
                  }

                </div>

              </div>


              ${staffBadgeHtml}


            </div>


          </div>


          <div
            class="value balance-value balance-column"
          >

            ◆ ${balance}

          </div>


          <div
            class="value muted-value games"
          >

            ${games}

          </div>


          <div
            class="value muted-value rating"
          >

            ${chessRating}

          </div>


        </div>

      `;

    }


    /* ==========================================
       HTML ESCAPE
    ========================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==========================================
       INITIALIZE
    ========================================== */

    async function init() {

      await Promise.all([
        loadCurrentUser(),
        loadLeaderboard()
      ]);

    }


    init();


    /* ==========================================
       AUTO REFRESH
    ========================================== */

    setInterval(
      loadLeaderboard,
      15000
    );

  </script>

</body>
</html>
