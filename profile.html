<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profile — Middle Eastern Mixing</title>

  <link rel="icon" href="/logo.gif">

  <style>

    /* ==========================================
       ROOT THEME VARIABLES
    ========================================== */

    :root {

      --black: #0b0a08;
      --black-2: #12100d;
      --black-3: #191611;

      --surface: #191611;
      --surface-2: #211d17;
      --surface-3: #29231c;

      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);

      --text: #f5f1e8;
      --text-2: #aaa398;
      --text-3: #746e65;

      --accent: #d7a84f;
      --accent-soft: rgba(215,168,79,0.10);

      --success: #68c18a;
      --danger: #d96c6c;

      --page-glow:
        rgba(215,168,79,0.08);

      --header-bg:
        rgba(11,10,8,0.92);

      --button-text:
        #17120a;

      --radius: 14px;

    }


    /* ==========================================
       MIXING AFTER DARK VARIABLES
    ========================================== */

    html.theme-mixing-after-dark,
    body.theme-mixing-after-dark {

      --black: #09070a;
      --black-2: #100b10;
      --black-3: #171017;

      --surface: #171018;
      --surface-2: #211520;
      --surface-3: #2a1b28;

      --border:
        rgba(215,168,79,0.13);

      --border-hover:
        rgba(215,168,79,0.25);

      --text: #f7f0e5;

      --text-2: #b7a9b1;

      --text-3: #766874;

      --accent: #d7a84f;

      --accent-soft:
        rgba(215,168,79,0.10);

      --success: #70c996;

      --danger: #dc737d;

      --page-glow:
        rgba(143,55,92,0.18);

      --header-bg:
        rgba(9,7,10,0.88);

      --button-text:
        #120c0e;

    }

/* ==========================================
   HELLO KITTY THEME VARIABLES
========================================== */

html.theme-hello-kitty,
body.theme-hello-kitty {

  --black: #fff5f7;
  --black-2: #ffe9ee;
  --black-3: #ffdce4;

  --surface: #fff0f3;
  --surface-2: #ffe4ea;
  --surface-3: #ffd6e0;

  --border:
    rgba(255,105,145,0.16);

  --border-hover:
    rgba(255,105,145,0.32);

  --text: #4a252f;

  --text-2: #8a5664;

  --text-3: #b6818e;

  --accent: #ff6f91;

  --accent-soft:
    rgba(255,111,145,0.12);

  --success: #67bd8b;

  --danger: #e85d72;

  --page-glow:
    rgba(255,105,145,0.20);

  --header-bg:
    rgba(255,245,247,0.90);

  --button-text:
    #ffffff;

}


    
    /* ==========================================
       GLOBAL
    ========================================== */

    * {
      box-sizing: border-box;
    }


    html {

      min-height: 100%;

      background:
        var(--black);

      transition:
        background .35s ease;

    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -10%,
          var(--page-glow),
          transparent 35%
        ),
        var(--black);

      color:
        var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition:
        background .35s ease,
        color .35s ease;

    }


    /* ==========================================
       FULL PAGE AFTER DARK BACKGROUND
    ========================================== */

    body.theme-mixing-after-dark {

      background:

        radial-gradient(
          circle at 15% 8%,
          rgba(143,55,92,0.16),
          transparent 28%
        ),

        radial-gradient(
          circle at 88% 20%,
          rgba(215,168,79,0.075),
          transparent 25%
        ),

        radial-gradient(
          circle at 50% 70%,
          rgba(75,24,53,0.10),
          transparent 36%
        ),

        linear-gradient(
          135deg,
          #09070a 0%,
          #100a10 38%,
          #0d080d 70%,
          #09070a 100%
        );

    }


    body.theme-mixing-after-dark::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 0;

      opacity: 1;

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(215,168,79,0.045),
          transparent 32%
        );

    }


    body.theme-mixing-after-dark .page,
    body.theme-mixing-after-dark .footer,
    body.theme-mixing-after-dark .header-inner {

      position: relative;

      z-index: 1;

    }


    a {

      color:
        inherit;

      text-decoration:
        none;

    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {

      position: sticky;

      top: 0;

      z-index: 100;

      height: 70px;

      background:
        var(--header-bg);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid var(--border);

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .header {

      box-shadow:
        0 8px 35px
        rgba(0,0,0,0.30),

        inset 0 -1px 0
        rgba(215,168,79,0.025);

    }


    .header-inner {

      width:
        min(
          1200px,
          calc(100% - 40px)
        );

      height: 100%;

      margin: 0 auto;

      display: flex;

      align-items: center;

      gap: 24px;

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 11px;

      font-weight: 800;

      white-space: nowrap;

    }


    .brand img {

      width: 34px;

      height: 34px;

      border-radius: 9px;

      object-fit: cover;

      transition:
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .brand img {

      box-shadow:
        0 0 0 1px
        rgba(215,168,79,0.18),

        0 0 22px
        rgba(143,55,92,0.22);

    }


    .brand span {

      font-size: 15px;

    }


    .nav {

      display: flex;

      align-items: center;

      gap: 5px;

      margin-left: auto;

    }


    .nav-link {

      display: flex;

      align-items: center;

      gap: 8px;

      padding:
        9px 12px;

      color:
        var(--text-2);

      border-radius: 9px;

      font-size: 13px;

      font-weight: 600;

      transition:
        color .15s ease,
        background .15s ease,
        box-shadow .15s ease;

    }


    .nav-link:hover {

      color:
        var(--text);

      background:
        rgba(255,255,255,0.05);

    }


    body.theme-mixing-after-dark .nav-link:hover {

      background:
        rgba(143,55,92,0.12);

      box-shadow:
        inset 0 0 0 1px
        rgba(215,168,79,0.04);

    }


    .nav-link.active {

      color:
        var(--accent);

      background:
        rgba(215,168,79,0.08);

    }


    body.theme-mixing-after-dark .nav-link.active {

      background:
        linear-gradient(
          135deg,
          rgba(143,55,92,0.16),
          rgba(215,168,79,0.07)
        );

      box-shadow:
        inset 0 0 0 1px
        rgba(215,168,79,0.08);

    }


    .nav-link svg {

      width: 16px;

      height: 16px;

    }


    .account {

      display: flex;

      align-items: center;

      gap: 10px;

    }


    .balance {

      display: flex;

      align-items: center;

      gap: 7px;

      padding:
        8px 11px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 9px;

      font-size: 13px;

      font-weight: 700;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .balance {

      background:
        rgba(23,16,24,0.82);

      border-color:
        rgba(215,168,79,0.14);

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.20);

    }


    .coin {

      color:
        var(--accent);

    }


    .login {

      padding:
        9px 13px;

      border-radius: 9px;

      background:
        var(--accent);

      color:
        var(--button-text);

      font-size: 13px;

      font-weight: 800;

    }


    .user-button {

      display: flex;

      align-items: center;

      gap: 8px;

      padding:
        4px 9px 4px 4px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 10px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .user-button {

      background:
        rgba(23,16,24,0.86);

      border-color:
        rgba(215,168,79,0.14);

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.18);

    }


    .user-button img {

      width: 29px;

      height: 29px;

      border-radius: 8px;

      object-fit: cover;

    }


    .user-name {

      max-width: 100px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 700;

    }


    /* ==========================================
       PAGE
    ========================================== */

    .page {

      width:
        min(
          1000px,
          calc(100% - 40px)
        );

      margin: 0 auto;

      padding:
        54px 0 70px;

    }


    .eyebrow {

      margin-bottom: 9px;

      color:
        var(--accent);

      font-size: 11px;

      font-weight: 800;

      letter-spacing:
        .13em;

      text-transform:
        uppercase;

    }


    body.theme-mixing-after-dark .eyebrow {

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.18);

    }


    h1 {

      margin: 0;

      font-size:
        clamp(30px, 5vw, 44px);

      line-height: 1.05;

      letter-spacing:
        -0.035em;

    }


    .description {

      max-width: 650px;

      margin:
        13px 0 30px;

      color:
        var(--text-2);

      font-size: 15px;

      line-height: 1.7;

    }


    /* ==========================================
       PROFILE CARD
    ========================================== */

    .profile-card {

      position: relative;

      padding:
        26px;

      display: flex;

      align-items: center;

      gap: 20px;

      background:

        linear-gradient(
          145deg,
          rgba(215,168,79,0.055),
          transparent 65%
        ),

        var(--surface);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      overflow: hidden;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    /* ==========================================
       MIXING AFTER DARK PROFILE CARD
    ========================================== */

    .profile-card.theme-mixing-after-dark {

      background:

        radial-gradient(
          circle at 82% 18%,
          rgba(143,55,92,0.22),
          transparent 28%
        ),

        radial-gradient(
          circle at 12% 85%,
          rgba(215,168,79,0.09),
          transparent 30%
        ),

        linear-gradient(
          145deg,
          rgba(70,25,48,0.70),
          rgba(24,14,20,0.94) 45%,
          #0e0b0d 100%
        );

      border-color:
        rgba(215,168,79,0.28);

      box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.025),

        0 14px 45px
        rgba(0,0,0,0.30),

        0 0 45px
        rgba(83,27,59,0.10);

    }


    .profile-card.theme-mixing-after-dark::before {

      content:
        "MIXING AFTER DARK";

      position:
        absolute;

      right:
        -20px;

      bottom:
        -22px;

      color:
        rgba(215,168,79,0.035);

      font-size:
        72px;

      font-weight:
        900;

      letter-spacing:
        -0.06em;

      white-space:
        nowrap;

      pointer-events:
        none;

      transform:
        rotate(-7deg);

    }


    .profile-card.theme-mixing-after-dark::after {

      content:
        "✦  ·  ✧  ·  ✦  ·  ✧";

      position:
        absolute;

      top:
        14px;

      right:
        28px;

      color:
        rgba(215,168,79,0.12);

      font-size:
        13px;

      letter-spacing:
        9px;

      pointer-events:
        none;

    }


    /* ==========================================
       NAMEPLATE THEMES
    ========================================== */

    .profile-card.nameplate-gold {

      background:

        linear-gradient(
          135deg,
          rgba(215,168,79,0.18),
          rgba(215,168,79,0.04) 45%,
          var(--surface) 85%
        );

      border-color:
        rgba(215,168,79,0.30);

    }


    .profile-card.nameplate-royal {

      background:

        linear-gradient(
          135deg,
          rgba(150,110,220,0.16),
          rgba(215,168,79,0.04) 48%,
          var(--surface) 85%
        );

      border-color:
        rgba(150,110,220,0.28);

    }


    .profile-card.nameplate-diamond {

      background:

        linear-gradient(
          135deg,
          rgba(120,205,235,0.16),
          rgba(215,168,79,0.03) 48%,
          var(--surface) 85%
        );

      border-color:
        rgba(120,205,235,0.30);

    }


    .profile-card.theme-mixing-after-dark.nameplate-gold,
    .profile-card.theme-mixing-after-dark.nameplate-royal,
    .profile-card.theme-mixing-after-dark.nameplate-diamond {

      background:

        radial-gradient(
          circle at 82% 18%,
          rgba(143,55,92,0.22),
          transparent 28%
        ),

        radial-gradient(
          circle at 12% 85%,
          rgba(215,168,79,0.08),
          transparent 30%
        ),

        linear-gradient(
          145deg,
          rgba(70,25,48,0.70),
          rgba(24,14,20,0.94) 45%,
          #0e0b0d 100%
        );

      border-color:
        rgba(215,168,79,0.28);

    }


    /* ==========================================
       PROFILE AVATAR
    ========================================== */

    .profile-avatar {

      width: 82px;

      height: 82px;

      flex-shrink: 0;

      border-radius: 20px;

      background:
        var(--surface-3);

      border:
        1px solid var(--border);

      object-fit: cover;

      position: relative;

      z-index: 2;

      transition:
        border-color .35s ease,
        box-shadow .35s ease;

    }


    .profile-card.theme-mixing-after-dark
    .profile-avatar {

      border-color:
        rgba(215,168,79,0.30);

      box-shadow:

        0 0 0 4px
        rgba(215,168,79,0.035),

        0 0 24px
        rgba(143,55,92,0.22);

    }


    .profile-info {

      min-width: 0;

      position: relative;

      z-index: 2;

    }


    .profile-name {

      margin: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 23px;

      font-weight: 800;

      letter-spacing:
        -0.025em;

    }


/* ==========================================
   PROFILE TITLE
========================================== */

.profile-title {

  margin-top: 7px;

  display: inline-flex;

  align-items: center;

  gap: 7px;

  position: relative;

  color: #f0ca70;

  font-size: 11px;

  font-weight: 900;

  letter-spacing: .11em;

  text-transform: uppercase;

  text-shadow:
    0 0 5px rgba(240,202,112,0.55),
    0 0 12px rgba(214,168,92,0.45),
    0 0 24px rgba(214,168,92,0.25);

  animation:
    mixingLegendGlow 2.8s ease-in-out infinite;

}


/* ==========================================
   TITLE ICON
========================================== */

.profile-title-icon {

  font-size: 13px;

  line-height: 1;

  color: #ffe4a0;

  text-shadow:
    0 0 5px rgba(255,228,160,0.9),
    0 0 12px rgba(214,168,92,0.8),
    0 0 22px rgba(214,168,92,0.55);

  animation:
    mixingLegendIcon 2.2s ease-in-out infinite;

}


/* ==========================================
   MIXING LEGEND
========================================== */

.profile-title:has(
  .profile-title-icon
) {

  isolation: isolate;

}


/* ==========================================
   GLOW PULSE
========================================== */

@keyframes mixingLegendGlow {

  0%,
  100% {

    opacity: .88;

    text-shadow:
      0 0 5px rgba(240,202,112,0.45),
      0 0 12px rgba(214,168,92,0.35),
      0 0 24px rgba(214,168,92,0.18);

  }

  50% {

    opacity: 1;

    text-shadow:
      0 0 6px rgba(255,224,145,0.8),
      0 0 15px rgba(214,168,92,0.7),
      0 0 30px rgba(214,168,92,0.45),
      0 0 50px rgba(214,168,92,0.18);

  }

}


/* ==========================================
   ICON PULSE
========================================== */

@keyframes mixingLegendIcon {

  0%,
  100% {

    transform:
      scale(1)
      rotate(0deg);

    filter:
      drop-shadow(
        0 0 4px
        rgba(255,224,145,0.55)
      );

  }

  50% {

    transform:
      scale(1.16)
      rotate(8deg);

    filter:
      drop-shadow(
        0 0 9px
        rgba(255,224,145,0.95)
      )
      drop-shadow(
        0 0 18px
        rgba(214,168,92,0.65)
      );

  }

}


/* ==========================================
   AFTER DARK VERSION
========================================== */

body.theme-mixing-after-dark
.profile-title {

  color: #f5d989;

  text-shadow:
    0 0 6px rgba(245,217,137,0.75),
    0 0 15px rgba(214,168,92,0.65),
    0 0 30px rgba(214,168,92,0.4),
    0 0 55px rgba(214,168,92,0.18);

}


body.theme-mixing-after-dark
.profile-title-icon {

  color: #ffe9ad;

  text-shadow:
    0 0 6px rgba(255,233,173,0.95),
    0 0 14px rgba(214,168,92,0.85),
    0 0 28px rgba(214,168,92,0.6);

}


    /* ==========================================
       NAMEPLATE TEXT
    ========================================== */

    .profile-name.gold {

      color:
        #e8c16d;

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.25);

    }


    .profile-name.royal {

      color:
        #c6a6f0;

      text-shadow:
        0 0 18px
        rgba(150,110,220,0.22);

    }


    .profile-name.diamond {

      color:
        #9edff2;

      text-shadow:
        0 0 18px
        rgba(120,205,235,0.24);

    }


    .profile-card.theme-mixing-after-dark
    .profile-name:not(.gold):not(.royal):not(.diamond) {

      color:
        #e4c477;

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.20);

    }


    .profile-discord {

      margin-top: 5px;

      color:
        var(--text-2);

      font-size: 12px;

    }


    .profile-id {

      margin-top: 9px;

      color:
        var(--text-3);

      font-size: 10px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    }


    /* ==========================================
       PROFILE BADGES
    ========================================== */

    .profile-badges {

      margin-left: auto;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      gap: 8px;

      position: relative;

      z-index: 2;

    }


    .profile-badge {

      width: 62px;

      height: 62px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .profile-badge img {

      width: 58px;

      height: 58px;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(
          0 5px 14px
          rgba(0,0,0,0.30)
        );

    }


    .profile-badge.staff img {

      filter:

        drop-shadow(
          0 0 10px
          rgba(215,168,79,0.22)
        )

        drop-shadow(
          0 5px 14px
          rgba(0,0,0,0.30)
        );

    }


    /* ==========================================
       EQUIPPED DISPLAY
    ========================================== */

    .equipped-display {

      margin-top: 18px;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }


    .equipped-item {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding:
        6px 9px;

      border:
        1px solid var(--border);

      border-radius: 999px;

      background:
        rgba(255,255,255,0.035);

      color:
        var(--text-2);

      font-size: 10px;

      font-weight: 750;

      transition:
        background .35s ease,
        border-color .35s ease,
        color .35s ease;

    }


    body.theme-mixing-after-dark
    .equipped-item {

      border-color:
        rgba(215,168,79,0.18);

      background:
        rgba(215,168,79,0.045);

      box-shadow:
        0 3px 14px
        rgba(0,0,0,0.12);

    }


    .equipped-item-icon {

      color:
        var(--accent);

      font-size: 12px;

    }


    /* ==========================================
       BALANCE
    ========================================== */

    .balance-card {

      margin-top: 18px;

      padding:
        22px 24px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark
    .balance-card {

      background:

        linear-gradient(
          135deg,
          rgba(143,55,92,0.08),
          rgba(23,16,24,0.94)
        );

      border-color:
        rgba(215,168,79,0.16);

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.18);

    }


    .balance-label {

      color:
        var(--text-3);

      font-size: 10px;

      font-weight: 800;

      letter-spacing:
        .1em;

      text-transform:
        uppercase;

    }


    .balance-number {

      margin-top: 7px;

      color:
        var(--accent);

      font-size: 31px;

      font-weight: 850;

      letter-spacing:
        -0.035em;

    }


    body.theme-mixing-after-dark
    .balance-number {

      text-shadow:
        0 0 22px
        rgba(215,168,79,0.16);

    }


    /* ==========================================
       SECTION TITLE
    ========================================== */

    .section-title {

      margin:
        30px 0 13px;

      font-size: 14px;

      font-weight: 800;

    }


    body.theme-mixing-after-dark
    .section-title {

      color:
        #eee3e8;

    }


    /* ==========================================
       STAT GRID
    ========================================== */

    .stats-grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 12px;

    }


    .stat-card {

      padding: 18px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 12px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease,
        transform .15s ease;

    }


    body.theme-mixing-after-dark
    .stat-card {

      background:

        linear-gradient(
          145deg,
          rgba(35,22,34,0.94),
          rgba(20,13,20,0.96)
        );

      border-color:
        rgba(215,168,79,0.11);

    }


    body.theme-mixing-after-dark
    .stat-card:hover {

      transform:
        translateY(-2px);

      border-color:
        rgba(215,168,79,0.22);

      box-shadow:
        0 10px 28px
        rgba(0,0,0,0.20);

    }


    .stat-label {

      color:
        var(--text-3);

      font-size: 10px;

      font-weight: 800;

      letter-spacing:
        .07em;

      text-transform:
        uppercase;

    }


    .stat-value {

      margin-top: 8px;

      font-size: 20px;

      font-weight: 800;

      letter-spacing:
        -0.02em;

    }


    .stat-value.success {

      color:
        var(--success);

    }


    .stat-value.danger {

      color:
        var(--danger);

    }


    .stat-value.accent {

      color:
        var(--accent);

    }


    /* ==========================================
       FINANCIAL STATS
    ========================================== */

    .financial-grid {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 12px;

    }


    .financial-card {

      padding: 20px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 12px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease,
        transform .15s ease;

    }


    body.theme-mixing-after-dark
    .financial-card {

      background:

        linear-gradient(
          145deg,
          rgba(35,22,34,0.94),
          rgba(20,13,20,0.96)
        );

      border-color:
        rgba(215,168,79,0.11);

    }


    body.theme-mixing-after-dark
    .financial-card:hover {

      transform:
        translateY(-2px);

      border-color:
        rgba(215,168,79,0.22);

      box-shadow:
        0 10px 28px
        rgba(0,0,0,0.20);

    }


    .financial-label {

      color:
        var(--text-3);

      font-size: 10px;

      font-weight: 800;

      letter-spacing:
        .07em;

      text-transform:
        uppercase;

    }


    .financial-value {

      margin-top: 8px;

      font-size: 19px;

      font-weight: 800;

    }


    .financial-value.accent {

      color:
        var(--accent);

    }


    /* ==========================================
       CHESS
    ========================================== */

    .chess-card {

      padding:
        21px 22px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 12px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark
    .chess-card {

      background:

        linear-gradient(
          145deg,
          rgba(40,24,38,0.96),
          rgba(18,11,18,0.98)
        );

      border-color:
        rgba(215,168,79,0.14);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.16);

    }


    .chess-left {

      display: flex;

      align-items: center;

      gap: 14px;

    }


    .chess-icon {

      width: 45px;

      height: 45px;

      display: grid;

      place-items: center;

      background:
        var(--surface-3);

      border:
        1px solid var(--border);

      border-radius: 11px;

      font-size: 23px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark
    .chess-icon {

      background:
        rgba(143,55,92,0.12);

      border-color:
        rgba(215,168,79,0.13);

      box-shadow:
        inset 0 0 20px
        rgba(143,55,92,0.08);

    }


    .chess-title {

      font-size: 13px;

      font-weight: 800;

    }


    .chess-subtitle {

      margin-top: 4px;

      color:
        var(--text-3);

      font-size: 10px;

    }


    .chess-rating {

      color:
        var(--accent);

      font-size: 23px;

      font-weight: 850;

    }


    body.theme-mixing-after-dark
    .chess-rating {

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.18);

    }


    /* ==========================================
       ACTIONS
    ========================================== */

    .actions {

      margin-top: 28px;

      display: flex;

      gap: 10px;

    }


    .action-button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      padding:
        10px 15px;

      border-radius: 9px;

      font-size: 12px;

      font-weight: 800;

      border:
        1px solid var(--border);

      background:
        var(--surface);

      transition:
        background .15s ease,
        border-color .15s ease,
        box-shadow .15s ease,
        transform .15s ease;

    }


    .action-button:hover {

      background:
        var(--surface-2);

      border-color:
        var(--border-hover);

    }


    body.theme-mixing-after-dark
    .action-button:not(.primary):hover {

      background:
        rgba(143,55,92,0.12);

      border-color:
        rgba(215,168,79,0.20);

      box-shadow:
        0 7px 20px
        rgba(0,0,0,0.18);

      transform:
        translateY(-1px);

    }


    .action-button.primary {

      background:
        var(--accent);

      color:
        var(--button-text);

      border-color:
        var(--accent);

    }


    .action-button.primary:hover {

      background:
        #e0b45d;

    }


    body.theme-mixing-after-dark
    .action-button.primary {

      box-shadow:
        0 7px 24px
        rgba(215,168,79,0.12);

    }


    /* ==========================================
       LOADING / LOGIN
    ========================================== */

    .loading,
    .error,
    .login-required {

      padding:
        60px 20px;

      text-align:
        center;

      color:
        var(--text-2);

      font-size: 13px;

    }


    .error {

      color:
        var(--danger);

    }


    .login-required a {

      display: inline-block;

      margin-top: 15px;

      padding:
        10px 16px;

      background:
        var(--accent);

      color:
        var(--button-text);

      border-radius: 9px;

      font-size: 12px;

      font-weight: 800;

    }


    /* ==========================================
       FOOTER
    ========================================== */

    .footer {

      width:
        min(
          1000px,
          calc(100% - 40px)
        );

      margin:
        0 auto;

      padding:
        24px 0 35px;

      border-top:
        1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content: space-between;

      color:
        var(--text-3);

      font-size: 11px;

      transition:
        border-color .35s ease,
        color .35s ease;

    }


    body.theme-mixing-after-dark
    .footer {

      border-top-color:
        rgba(215,168,79,0.10);

    }


    .footer-links {

      display: flex;

      gap: 18px;

    }


    .footer-links a {

      transition:
        color .15s ease;

    }


    .footer-links a:hover {

      color:
        var(--text-2);

    }


    body.theme-mixing-after-dark
    .footer-links a:hover {

      color:
        var(--accent);

    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 800px) {

      .stats-grid {

        grid-template-columns:
          repeat(2, minmax(0, 1fr));

      }


      .financial-grid {

        grid-template-columns:
          1fr;

      }


      .nav-link span {

        display: none;

      }


      .nav-link {

        padding: 9px;

      }

    }


    @media (max-width: 600px) {

      .header-inner,
      .page,
      .footer {

        width:
          calc(100% - 28px);

      }


      .header {

        height: 62px;

      }


      .brand span {

        display: none;

      }


      .balance {

        display: none;

      }


      .page {

        padding-top: 38px;

      }


      .profile-card {

        padding: 20px;

        align-items: flex-start;

        gap: 14px;

      }


      .profile-avatar {

        width: 65px;

        height: 65px;

        border-radius: 16px;

      }


      .profile-name {

        font-size: 19px;

      }


      .profile-title {

        font-size: 10px;

      }


      .profile-badges {

        gap: 5px;

      }


      .profile-badge {

        width: 48px;

        height: 48px;

      }


      .profile-badge img {

        width: 45px;

        height: 45px;

      }


      .stats-grid {

        gap: 9px;

      }


      .stat-card {

        padding: 15px;

      }


      .stat-value {

        font-size: 18px;

      }


      .chess-card {

        padding: 17px;

      }


      .actions {

        flex-direction: column;

      }


      .action-button {

        width: 100%;

      }


      .footer {

        align-items: flex-start;

        flex-direction: column;

        gap: 12px;

      }

    }

   HELLO KITTY FULL PAGE BACKGROUND

/* ==========================================
   SWORD THEME VARIABLES
========================================== */

html.theme-sword,
body.theme-sword {

  --black: #020202;
  --black-2: rgba(3,3,3,0.40);
  --black-3: rgba(8,8,8,0.52);

  --surface: rgba(5,5,5,0.34);
  --surface-2: rgba(10,10,10,0.42);
  --surface-3: rgba(18,18,18,0.52);

  --border:
    rgba(255,255,255,0.12);

  --border-hover:
    rgba(255,255,255,0.28);

  --text:
    #ffffff;

  --text-2:
    rgba(255,255,255,0.72);

  --text-3:
    rgba(255,255,255,0.45);

  --accent:
    #f1f1f1;

  --accent-soft:
    rgba(255,255,255,0.09);

  --success:
    #8bd6a5;

  --danger:
    #e87878;

  --page-glow:
    rgba(255,255,255,0.05);

  --header-bg:
    rgba(0,0,0,0.42);

  --button-text:
    #050505;
}


/* ==========================================
   SWORD VIDEO BACKGROUND
========================================== */

.sword-theme-background {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0;

  overflow: hidden;

  background: #000;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity .5s ease;

}


/* VIDEO */

.sword-theme-background video {

  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  object-position: center;

  display: block;

}


/* DARK GLASS OVERLAY */

.sword-theme-overlay {

  position: absolute;

  inset: 0;

  background:

    linear-gradient(
      180deg,
      rgba(0,0,0,0.34) 0%,
      rgba(0,0,0,0.16) 35%,
      rgba(0,0,0,0.34) 100%
    );

}


/* ENABLE VIDEO */

body.theme-sword
.sword-theme-background {

  opacity: 1;

}


/* ==========================================
   SWORD PAGE
========================================== */

body.theme-sword {

  background:
    #000;

  color:
    var(--text);

}


/* ==========================================
   CONTENT ABOVE VIDEO
========================================== */

body.theme-sword .header,
body.theme-sword .page,
body.theme-sword .footer {

  position: relative;

  z-index: 2;

}


/* ==========================================
   HEADER
========================================== */

body.theme-sword .header {

  background:
    rgba(0,0,0,0.38);

  border-bottom:
    1px solid
    rgba(255,255,255,0.10);

  backdrop-filter:
    blur(16px);

  -webkit-backdrop-filter:
    blur(16px);

  box-shadow:
    0 10px 40px
    rgba(0,0,0,0.35);

}


/* ==========================================
   BRAND
========================================== */

body.theme-sword .brand img {

  box-shadow:

    0 0 0 1px
    rgba(255,255,255,0.14),

    0 0 25px

/* ==========================================
   NAV
========================================== */

body.theme-sword .nav-link:hover {

    rgba(255,255,255,0.07);

  box-shadow:
    inset 0 0 0 1px

}


body.theme-sword .nav-link.active {

  color:
    #ffffff;

  background:
    rgba(255,255,255,0.10);

  box-shadow:
    inset 0 0 0 1px
    rgba(255,255,255,0.12);

}


/* ==========================================

body.theme-sword .user-button {

  background:
    rgba(0,0,0,0.38);

  border-color:
    rgba(255,255,255,0.12);

  backdrop-filter:
    blur(10px);

  -webkit-backdrop-filter:
    blur(10px);

  box-shadow:
    0 8px 25px
    rgba(0,0,0,0.28);

}


/* ==========================================
   PROFILE CARD
========================================== */

body.theme-sword .profile-card {

body.theme-sword
.profile-avatar {

/* ==========================================
   SWORD SOUND PROMPT
========================================== */

.sword-sound-prompt {
  position: fixed;

  right: 24px;
  bottom: 24px;

  z-index: 100;

  display: flex;
  align-items: center;
  gap: 14px;

  min-width: 300px;
  max-width: 420px;

  padding: 14px 16px;

  box-sizing: border-box;

  background:
    rgba(8, 8, 8, 0.72);

  border:
    1px solid rgba(255,255,255,0.16);

  border-radius: 14px;

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  box-shadow:
    0 16px 45px rgba(0,0,0,0.35);

  color: #ffffff;

  animation:
    swordSoundPromptIn
    0.35s
    ease
    both;
}


/* ==========================================
   HIDE PROMPT BY DEFAULT
========================================== */

/*
 * The prompt is NEVER visible unless
 * Sword Theme is currently active.
 */

.sword-sound-prompt[hidden] {
  display: none !important;
}

body:not(.theme-sword) .sword-sound-prompt {
  display: none !important;
}


/* ==========================================
   SWORD THEME ONLY
========================================== */

body.theme-sword .sword-sound-prompt {
  display: flex;
}


/* ==========================================
   ICON
========================================== */

.sword-sound-prompt-icon {
  width: 38px;
  height: 38px;

  flex: 0 0 38px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 10px;

  background:
    rgba(255,255,255,0.08);

  font-size: 18px;
}


/* ==========================================
   CONTENT
========================================== */

.sword-sound-prompt-content {
  min-width: 0;
  flex: 1;
}


/* ==========================================
   TITLE
========================================== */

.sword-sound-prompt-title {
  font-size: 14px;
  font-weight: 700;

  line-height: 1.2;

  margin-bottom: 3px;
}


/* ==========================================
   DESCRIPTION
========================================== */

.sword-sound-prompt-text {
  font-size: 12px;

  color:
    rgba(255,255,255,0.58);

  line-height: 1.4;
}


/* ==========================================
   SOUND BUTTON
========================================== */

.sword-sound-prompt-button {
  border: 0;

  padding: 9px 12px;

  border-radius: 9px;

  background:
    #ffffff;

  color:
    #050505;

  font-size: 12px;

  font-weight: 700;

  cursor: pointer;

  white-space: nowrap;

  transition:
    transform 0.15s ease,
    opacity 0.15s ease;
}


.sword-sound-prompt-button:hover {
  transform: translateY(-1px);
  opacity: 0.9;
}


/* ==========================================
   CLOSE BUTTON
========================================== */

.sword-sound-prompt-close {
  width: 24px;
  height: 24px;

  padding: 0;

  border: 0;

  background: transparent;

  color:
    rgba(255,255,255,0.45);

  font-size: 20px;

  line-height: 1;

  cursor: pointer;
}


.sword-sound-prompt-close:hover {
  color: #ffffff;
}


/* ==========================================
   ANIMATION
========================================== */

@keyframes swordSoundPromptIn {

  from {
    opacity: 0;
    transform: translateY(12px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}


/* ==========================================
   MOBILE
========================================== */

@media (max-width: 600px) {

  .sword-sound-prompt {
    left: 16px;
    right: 16px;
    bottom: 16px;

    min-width: 0;
    width: auto;
  }

}

<script>

  const API_URL =
    "https://api.memplace.xyz";


  let currentUser = null;


  /* ==========================================
     PUBLIC PROFILE DETECTION
  ========================================== */

  function getPublicProfileUsername() {

    const parts =
      window.location.pathname
        .split("/")
        .filter(Boolean);


    if (
      parts.length >= 2 &&
      parts[0].toLowerCase() === "profile"
    ) {

      return decodeURIComponent(
        parts[1]
      );

    }


    return null;

  }


  const publicProfileUsername =
    getPublicProfileUsername();


  const isPublicProfile =
    !!publicProfileUsername;


  /* ==========================================
     DISCORD AVATAR
  ========================================== */

  function getDiscordAvatarUrl(user) {

    if (!user) {
      return null;
    }


    /*
     * Already a complete URL.
     */
    if (
      typeof user.avatar === "string" &&
      (
        user.avatar.startsWith("https://") ||
        user.avatar.startsWith("http://")
      )
    ) {

      return user.avatar;

    }


    /*
     * Direct avatarUrl from database.
     */
    if (
      typeof user.avatarUrl === "string" &&
      user.avatarUrl
    ) {

      return user.avatarUrl;

    }


    /*
     * Discord avatar hash + Discord user ID.
     */
    if (
      user.id &&
      user.avatar
    ) {

      return (
        "https://cdn.discordapp.com/avatars/" +
        encodeURIComponent(
          String(user.id)
        ) +
        "/" +
        encodeURIComponent(
          String(user.avatar)
        ) +
        ".png?size=256"
      );

    }


    return null;

  }


  /* ==========================================
     APPLY PAGE THEME
  ========================================== */

  function applyPageTheme(
    equippedTheme
  ) {

    const html =
      document.documentElement;

    const body =
      document.body;


    html.classList.remove(
      "theme-mixing-after-dark",
      "theme-hello-kitty",
      "theme-sword"
    );


    body.classList.remove(
      "theme-mixing-after-dark",
      "theme-hello-kitty",
      "theme-sword",
      "theme-sakura"
    );


    if (
      equippedTheme ===
      "mixing-after-dark"
    ) {

      html.classList.add(
        "theme-mixing-after-dark"
      );

      body.classList.add(
        "theme-mixing-after-dark"
      );

    }


    if (
      equippedTheme ===
      "hello-kitty-theme"
    ) {

      html.classList.add(
        "theme-hello-kitty"
      );

      body.classList.add(
        "theme-hello-kitty"
      );

    }

    if (
      equippedTheme ===
      "sakura-theme"
    ) {

      html.classList.add(
        "theme-sakura"
      );

      body.classList.add(
        "theme-sakura"
      );

    }


if (
  equippedTheme ===
  "sword-theme"
) {

  html.classList.add(
    "theme-sword"
  );

  body.classList.add(
    "theme-sword"
  );


  if (
    typeof restartSwordTheme ===
    "function"
  ) {

    restartSwordTheme();

  }

} else {

  if (
    typeof stopSwordTheme ===
    "function"
  ) {

    stopSwordTheme();

  }

 }

}


  /* ==========================================
     LOAD STAFF STATUS
  ========================================== */

  async function loadStaffStatus() {


    if (isPublicProfile) {
      return null;
    }


    try {

      const response =
        await fetch(
          API_URL + "/api/admin/me",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store"
          }
        );


      if (!response.ok) {
        return null;
      }


      const data =
        await response.json();


      if (
        !data.success ||
        !data.staff
      ) {

        return null;

      }


      return {

        staff: true,

        role:
          data.role ||
          null

      };


    } catch (error) {

      console.error(
        "STAFF STATUS ERROR:",
        error
      );

      return null;

    }

  }


  /* ==========================================
     LOAD PROFILE
  ========================================== */

  async function loadProfile() {

    const content =
      document.getElementById(
        "content"
      );


    if (!content) {
      return;
    }


    try {

      let response;


      /* ========================================
         PUBLIC PROFILE
      ======================================== */

      if (isPublicProfile) {

        response =
          await fetch(
            API_URL +
            "/api/profile?username=" +
            encodeURIComponent(
              publicProfileUsername
            ),
            {
              method: "GET",
              credentials: "omit",
              cache: "no-store"
            }
          );

      }


      /* ========================================
         OWN PROFILE
      ======================================== */

      else {

        response =
          await fetch(
            API_URL + "/api/user/me",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );

      }


      const data =
        await response.json();


      /* ========================================
         PUBLIC PROFILE RESPONSE
      ======================================== */

      if (isPublicProfile) {

        if (
          response.status === 404 ||
          !data.success ||
          !data.profile
        ) {

          content.innerHTML = `

            <section class="page-header">

              <div class="eyebrow">
                Middle Eastern Mixing
              </div>

              <h1>
                Profile Not Found
              </h1>

              <p class="description">
                The requested profile could not be found.
              </p>

            </section>

          `;


          applyPageTheme(null);


          return;

        }


        currentUser =
          data.profile;


        currentUser.id =
          data.profile.id ||
          null;


        currentUser.isStaff =
          !!data.profile.staff;


        currentUser.staffRole =
          data.profile.staff?.role ||
          null;


        applyPageTheme(
          currentUser.equippedTheme
        );


        updatePublicHeader(
          currentUser
        );


        renderProfile(
          currentUser,
          true
        );


        return;

      }


      /* ========================================
         OWN PROFILE RESPONSE
      ======================================== */

      if (
        response.status === 401 ||
        !data.authenticated ||
        !data.user
      ) {

        applyPageTheme(null);

        showLoginRequired();

        return;

      }


      if (
        !response.ok ||
        !data.success
      ) {

        throw new Error(
          data.error ||
          "Failed to load profile."
        );

      }


      currentUser =
        data.user;


      applyPageTheme(
        currentUser.equippedTheme
      );


      const staffStatus =
        await loadStaffStatus();


      currentUser.isStaff =
        !!staffStatus;


      currentUser.staffRole =
        staffStatus?.role ||
        null;


      updateHeader(
        currentUser
      );


      renderProfile(
        currentUser,
        false
      );


    } catch (error) {

      console.error(
        "PROFILE LOAD ERROR:",
        error
      );


      content.innerHTML = `

        <div class="error">
          Failed to load profile.
        </div>

      `;

    }

  }

     LOGIN REQUIRED
  ========================================== */

  function showLoginRequired() {

    const content =
      document.getElementById(
        "content"
      );


    content.innerHTML = `

      <section class="page-header">

        <div class="eyebrow">
          Middle Eastern Mixing
        </div>

        <h1>
          Profile
        </h1>

      </section>


      <div class="login-required">

        <div>
          You need to log in to view your profile.
        </div>


        <a
          href="https://api.memplace.xyz/api/auth/login"
        >
          Login with Discord
        </a>

      </div>

    `;

  }


  /* ==========================================
     HTML ESCAPE
  ========================================== */

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }

/* ==========================================
   SWORD THEME SOUND
========================================== */

const swordVideo =
  document.getElementById(
    "swordThemeVideo"
  );


const swordSoundPrompt =
  document.getElementById(
    "swordSoundPrompt"
  );


const swordSoundButton =
  document.getElementById(
    "swordSoundButton"
  );


const swordSoundClose =
  document.getElementById(
    "swordSoundClose"
  );


/* ==========================================
   SHOW SOUND PROMPT
========================================== */

function showSwordSoundPrompt() {

  if (
    !document.body.classList.contains(
      "theme-sword"
    )
  ) {
    return;
  }


  if (
    !swordSoundPrompt ||
    !swordVideo
  ) {
    return;
  }


  swordSoundPrompt.hidden =
    false;

}


/* ==========================================
   HIDE SOUND PROMPT
========================================== */

function hideSwordSoundPrompt() {

  if (!swordSoundPrompt) {
    return;
  }


  swordSoundPrompt.hidden =
    true;

}


/* ==========================================
   RESTART SWORD VIDEO
========================================== */

function restartSwordTheme() {

  if (!swordVideo) {
    return;
  }


  /*
   * Make absolutely sure this is
   * actually the Sword Theme.
   */
  if (
    !document.body.classList.contains(
      "theme-sword"
    )
  ) {

    stopSwordTheme();

    return;

  }


  try {

    swordVideo.pause();

    swordVideo.currentTime = 0;

    swordVideo.muted = true;

    swordVideo
      .play()
      .catch(() => {});

  } catch (error) {

    console.error(
      "Sword theme video restart error:",
      error
    );

  }


  /*
   * Reset sound button whenever
   * the Sword Theme is loaded.
   */
  if (swordSoundButton) {

    swordSoundButton.textContent =
      "🔊 Enable Sound";

  }


  showSwordSoundPrompt();

}


/* ==========================================
   STOP SWORD VIDEO
========================================== */

function stopSwordTheme() {

  if (!swordVideo) {
    return;
  }

  try {

    swordVideo.pause();

    swordVideo.currentTime = 0;

    swordVideo.muted = true;

  } catch (error) {

    console.error(
      "Sword theme video stop error:",
      error
    );

  }

  hideSwordSoundPrompt();

}


/* ==========================================
   ENABLE SWORD SOUND
========================================== */

if (
  swordSoundButton &&
  swordVideo
) {

  swordSoundButton.addEventListener(
    "click",
    async () => {

      /*
       * Don't allow the button to activate
       * if Sword Theme isn't active.
       */
      if (
        !document.body.classList.contains(
          "theme-sword"
        )
      ) {

        hideSwordSoundPrompt();

        return;

      }


      try {

        swordVideo.muted =
          false;


        await swordVideo.play();


        swordSoundButton.textContent =
          "🔊 Sound On";


        setTimeout(() => {

          /*
           * Only hide it if Sword Theme
           * is still active.
           */
          if (
            document.body.classList.contains(
              "theme-sword"
            )
          ) {

            hideSwordSoundPrompt();

          }

        }, 800);


      } catch (error) {

        console.error(
          "Sword theme audio error:",
          error
        );

      }

    }
  );

}


/* ==========================================
   CLOSE SOUND PROMPT
========================================== */

if (swordSoundClose) {

  swordSoundClose.addEventListener(
    "click",
    () => {

      hideSwordSoundPrompt();

    }
  );

}


  /* ==========================================
     INIT
  ========================================== */

  loadProfile();


  /* ==========================================
     REFRESH PROFILE
  ========================================== */

  setInterval(
    loadProfile,
    10000
  );

</script>
