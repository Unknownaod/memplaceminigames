<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profile — Middle Eastern Mixing</title>

  <link rel="icon" href="/logo.gif">

  <style>

    /* ==========================================
       ROOT THEME VARIABLES
    ========================================== */

    :root {

      --black: #0b0a08;
      --black-2: #12100d;
      --black-3: #191611;

      --surface: #191611;
      --surface-2: #211d17;
      --surface-3: #29231c;

      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);

      --text: #f5f1e8;
      --text-2: #aaa398;
      --text-3: #746e65;

      --accent: #d7a84f;
      --accent-soft: rgba(215,168,79,0.10);

      --success: #68c18a;
      --danger: #d96c6c;

      --page-glow:
        rgba(215,168,79,0.08);

      --header-bg:
        rgba(11,10,8,0.92);

      --button-text:
        #17120a;

      --radius: 14px;

    }


    /* ==========================================
       MIXING AFTER DARK VARIABLES
    ========================================== */

    html.theme-mixing-after-dark,
    body.theme-mixing-after-dark {

      --black: #09070a;
      --black-2: #100b10;
      --black-3: #171017;

      --surface: #171018;
      --surface-2: #211520;
      --surface-3: #2a1b28;

      --border:
        rgba(215,168,79,0.13);

      --border-hover:
        rgba(215,168,79,0.25);

      --text: #f7f0e5;

      --text-2: #b7a9b1;

      --text-3: #766874;

      --accent: #d7a84f;

      --accent-soft:
        rgba(215,168,79,0.10);

      --success: #70c996;

      --danger: #dc737d;

      --page-glow:
        rgba(143,55,92,0.18);

      --header-bg:
        rgba(9,7,10,0.88);

      --button-text:
        #120c0e;

    }


    /* ==========================================
       GLOBAL
    ========================================== */

    * {
      box-sizing: border-box;
    }


    html {

      min-height: 100%;

      background:
        var(--black);

      transition:
        background .35s ease;

    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% -10%,
          var(--page-glow),
          transparent 35%
        ),
        var(--black);

      color:
        var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition:
        background .35s ease,
        color .35s ease;

    }


    /* ==========================================
       FULL PAGE AFTER DARK BACKGROUND
    ========================================== */

    body.theme-mixing-after-dark {

      background:

        radial-gradient(
          circle at 15% 8%,
          rgba(143,55,92,0.16),
          transparent 28%
        ),

        radial-gradient(
          circle at 88% 20%,
          rgba(215,168,79,0.075),
          transparent 25%
        ),

        radial-gradient(
          circle at 50% 70%,
          rgba(75,24,53,0.10),
          transparent 36%
        ),

        linear-gradient(
          135deg,
          #09070a 0%,
          #100a10 38%,
          #0d080d 70%,
          #09070a 100%
        );

    }


    body.theme-mixing-after-dark::before {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 0;

      opacity: 1;

      background:

        radial-gradient(
          circle at 50% 0%,
          rgba(215,168,79,0.045),
          transparent 32%
        );

    }


    body.theme-mixing-after-dark .page,
    body.theme-mixing-after-dark .footer,
    body.theme-mixing-after-dark .header-inner {

      position: relative;

      z-index: 1;

    }


    a {

      color:
        inherit;

      text-decoration:
        none;

    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {

      position: sticky;

      top: 0;

      z-index: 100;

      height: 70px;

      background:
        var(--header-bg);

      backdrop-filter:
        blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      border-bottom:
        1px solid var(--border);

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .header {

      box-shadow:
        0 8px 35px
        rgba(0,0,0,0.30),

        inset 0 -1px 0
        rgba(215,168,79,0.025);

    }


    .header-inner {

      width:
        min(
          1200px,
          calc(100% - 40px)
        );

      height: 100%;

      margin: 0 auto;

      display: flex;

      align-items: center;

      gap: 24px;

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 11px;

      font-weight: 800;

      white-space: nowrap;

    }


    .brand img {

      width: 34px;

      height: 34px;

      border-radius: 9px;

      object-fit: cover;

      transition:
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .brand img {

      box-shadow:
        0 0 0 1px
        rgba(215,168,79,0.18),

        0 0 22px
        rgba(143,55,92,0.22);

    }


    .brand span {

      font-size: 15px;

    }


    .nav {

      display: flex;

      align-items: center;

      gap: 5px;

      margin-left: auto;

    }


    .nav-link {

      display: flex;

      align-items: center;

      gap: 8px;

      padding:
        9px 12px;

      color:
        var(--text-2);

      border-radius: 9px;

      font-size: 13px;

      font-weight: 600;

      transition:
        color .15s ease,
        background .15s ease,
        box-shadow .15s ease;

    }


    .nav-link:hover {

      color:
        var(--text);

      background:
        rgba(255,255,255,0.05);

    }


    body.theme-mixing-after-dark .nav-link:hover {

      background:
        rgba(143,55,92,0.12);

      box-shadow:
        inset 0 0 0 1px
        rgba(215,168,79,0.04);

    }


    .nav-link.active {

      color:
        var(--accent);

      background:
        rgba(215,168,79,0.08);

    }


    body.theme-mixing-after-dark .nav-link.active {

      background:
        linear-gradient(
          135deg,
          rgba(143,55,92,0.16),
          rgba(215,168,79,0.07)
        );

      box-shadow:
        inset 0 0 0 1px
        rgba(215,168,79,0.08);

    }


    .nav-link svg {

      width: 16px;

      height: 16px;

    }


    .account {

      display: flex;

      align-items: center;

      gap: 10px;

    }


    .balance {

      display: flex;

      align-items: center;

      gap: 7px;

      padding:
        8px 11px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 9px;

      font-size: 13px;

      font-weight: 700;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .balance {

      background:
        rgba(23,16,24,0.82);

      border-color:
        rgba(215,168,79,0.14);

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.20);

    }


    .coin {

      color:
        var(--accent);

    }


    .login {

      padding:
        9px 13px;

      border-radius: 9px;

      background:
        var(--accent);

      color:
        var(--button-text);

      font-size: 13px;

      font-weight: 800;

    }


    .user-button {

      display: flex;

      align-items: center;

      gap: 8px;

      padding:
        4px 9px 4px 4px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 10px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark .user-button {

      background:
        rgba(23,16,24,0.86);

      border-color:
        rgba(215,168,79,0.14);

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.18);

    }


    .user-button img {

      width: 29px;

      height: 29px;

      border-radius: 8px;

      object-fit: cover;

    }


    .user-name {

      max-width: 100px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 12px;

      font-weight: 700;

    }


    /* ==========================================
       PAGE
    ========================================== */

    .page {

      width:
        min(
          1000px,
          calc(100% - 40px)
        );

      margin: 0 auto;

      padding:
        54px 0 70px;

    }


    .eyebrow {

      margin-bottom: 9px;

      color:
        var(--accent);

      font-size: 11px;

      font-weight: 800;

      letter-spacing:
        .13em;

      text-transform:
        uppercase;

    }


    body.theme-mixing-after-dark .eyebrow {

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.18);

    }


    h1 {

      margin: 0;

      font-size:
        clamp(30px, 5vw, 44px);

      line-height: 1.05;

      letter-spacing:
        -0.035em;

    }


    .description {

      max-width: 650px;

      margin:
        13px 0 30px;

      color:
        var(--text-2);

      font-size: 15px;

      line-height: 1.7;

    }


    /* ==========================================
       PROFILE CARD
    ========================================== */

    .profile-card {

      position: relative;

      padding:
        26px;

      display: flex;

      align-items: center;

      gap: 20px;

      background:

        linear-gradient(
          145deg,
          rgba(215,168,79,0.055),
          transparent 65%
        ),

        var(--surface);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      overflow: hidden;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    /* ==========================================
       MIXING AFTER DARK PROFILE CARD
    ========================================== */

    .profile-card.theme-mixing-after-dark {

      background:

        radial-gradient(
          circle at 82% 18%,
          rgba(143,55,92,0.22),
          transparent 28%
        ),

        radial-gradient(
          circle at 12% 85%,
          rgba(215,168,79,0.09),
          transparent 30%
        ),

        linear-gradient(
          145deg,
          rgba(70,25,48,0.70),
          rgba(24,14,20,0.94) 45%,
          #0e0b0d 100%
        );

      border-color:
        rgba(215,168,79,0.28);

      box-shadow:

        inset 0 1px 0
        rgba(255,255,255,0.025),

        0 14px 45px
        rgba(0,0,0,0.30),

        0 0 45px
        rgba(83,27,59,0.10);

    }


    .profile-card.theme-mixing-after-dark::before {

      content:
        "MIXING AFTER DARK";

      position:
        absolute;

      right:
        -20px;

      bottom:
        -22px;

      color:
        rgba(215,168,79,0.035);

      font-size:
        72px;

      font-weight:
        900;

      letter-spacing:
        -0.06em;

      white-space:
        nowrap;

      pointer-events:
        none;

      transform:
        rotate(-7deg);

    }


    .profile-card.theme-mixing-after-dark::after {

      content:
        "✦  ·  ✧  ·  ✦  ·  ✧";

      position:
        absolute;

      top:
        14px;

      right:
        28px;

      color:
        rgba(215,168,79,0.12);

      font-size:
        13px;

      letter-spacing:
        9px;

      pointer-events:
        none;

    }


    /* ==========================================
       NAMEPLATE THEMES
    ========================================== */

    .profile-card.nameplate-gold {

      background:

        linear-gradient(
          135deg,
          rgba(215,168,79,0.18),
          rgba(215,168,79,0.04) 45%,
          var(--surface) 85%
        );

      border-color:
        rgba(215,168,79,0.30);

    }


    .profile-card.nameplate-royal {

      background:

        linear-gradient(
          135deg,
          rgba(150,110,220,0.16),
          rgba(215,168,79,0.04) 48%,
          var(--surface) 85%
        );

      border-color:
        rgba(150,110,220,0.28);

    }


    .profile-card.nameplate-diamond {

      background:

        linear-gradient(
          135deg,
          rgba(120,205,235,0.16),
          rgba(215,168,79,0.03) 48%,
          var(--surface) 85%
        );

      border-color:
        rgba(120,205,235,0.30);

    }


    .profile-card.theme-mixing-after-dark.nameplate-gold,
    .profile-card.theme-mixing-after-dark.nameplate-royal,
    .profile-card.theme-mixing-after-dark.nameplate-diamond {

      background:

        radial-gradient(
          circle at 82% 18%,
          rgba(143,55,92,0.22),
          transparent 28%
        ),

        radial-gradient(
          circle at 12% 85%,
          rgba(215,168,79,0.08),
          transparent 30%
        ),

        linear-gradient(
          145deg,
          rgba(70,25,48,0.70),
          rgba(24,14,20,0.94) 45%,
          #0e0b0d 100%
        );

      border-color:
        rgba(215,168,79,0.28);

    }


    /* ==========================================
       PROFILE AVATAR
    ========================================== */

    .profile-avatar {

      width: 82px;

      height: 82px;

      flex-shrink: 0;

      border-radius: 20px;

      background:
        var(--surface-3);

      border:
        1px solid var(--border);

      object-fit: cover;

      position: relative;

      z-index: 2;

      transition:
        border-color .35s ease,
        box-shadow .35s ease;

    }


    .profile-card.theme-mixing-after-dark
    .profile-avatar {

      border-color:
        rgba(215,168,79,0.30);

      box-shadow:

        0 0 0 4px
        rgba(215,168,79,0.035),

        0 0 24px
        rgba(143,55,92,0.22);

    }


    .profile-info {

      min-width: 0;

      position: relative;

      z-index: 2;

    }


    .profile-name {

      margin: 0;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-size: 23px;

      font-weight: 800;

      letter-spacing:
        -0.025em;

    }


    /* ==========================================
       PROFILE TITLE
    ========================================== */

    .profile-title {

      margin-top: 6px;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      color:
        var(--accent);

      font-size: 11px;

      font-weight: 850;

      letter-spacing:
        .08em;

      text-transform:
        uppercase;

      text-shadow:
        0 0 16px
        rgba(215,168,79,0.18);

    }


    .profile-title-icon {

      font-size: 12px;

      line-height: 1;

    }


    body.theme-mixing-after-dark
    .profile-title {

      color:
        #e4c477;

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.28);

    }


    /* ==========================================
       NAMEPLATE TEXT
    ========================================== */

    .profile-name.gold {

      color:
        #e8c16d;

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.25);

    }


    .profile-name.royal {

      color:
        #c6a6f0;

      text-shadow:
        0 0 18px
        rgba(150,110,220,0.22);

    }


    .profile-name.diamond {

      color:
        #9edff2;

      text-shadow:
        0 0 18px
        rgba(120,205,235,0.24);

    }


    .profile-card.theme-mixing-after-dark
    .profile-name:not(.gold):not(.royal):not(.diamond) {

      color:
        #e4c477;

      text-shadow:
        0 0 18px
        rgba(215,168,79,0.20);

    }


    .profile-discord {

      margin-top: 5px;

      color:
        var(--text-2);

      font-size: 12px;

    }


    .profile-id {

      margin-top: 9px;

      color:
        var(--text-3);

      font-size: 10px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

    }


    /* ==========================================
       PROFILE BADGES
    ========================================== */

    .profile-badges {

      margin-left: auto;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      gap: 8px;

      position: relative;

      z-index: 2;

    }


    .profile-badge {

      width: 62px;

      height: 62px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .profile-badge img {

      width: 58px;

      height: 58px;

      object-fit: contain;

      display: block;

      filter:
        drop-shadow(
          0 5px 14px
          rgba(0,0,0,0.30)
        );

    }


    .profile-badge.staff img {

      filter:

        drop-shadow(
          0 0 10px
          rgba(215,168,79,0.22)
        )

        drop-shadow(
          0 5px 14px
          rgba(0,0,0,0.30)
        );

    }


    /* ==========================================
       EQUIPPED DISPLAY
    ========================================== */

    .equipped-display {

      margin-top: 18px;

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

    }


    .equipped-item {

      display: inline-flex;

      align-items: center;

      gap: 7px;

      padding:
        6px 9px;

      border:
        1px solid var(--border);

      border-radius: 999px;

      background:
        rgba(255,255,255,0.035);

      color:
        var(--text-2);

      font-size: 10px;

      font-weight: 750;

      transition:
        background .35s ease,
        border-color .35s ease,
        color .35s ease;

    }


    body.theme-mixing-after-dark
    .equipped-item {

      border-color:
        rgba(215,168,79,0.18);

      background:
        rgba(215,168,79,0.045);

      box-shadow:
        0 3px 14px
        rgba(0,0,0,0.12);

    }


    .equipped-item-icon {

      color:
        var(--accent);

      font-size: 12px;

    }


    /* ==========================================
       BALANCE
    ========================================== */

    .balance-card {

      margin-top: 18px;

      padding:
        22px 24px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius:
        var(--radius);

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;

    }


    body.theme-mixing-after-dark
    .balance-card {

      background:

        linear-gradient(
          135deg,
          rgba(143,55,92,0.08),
          rgba(23,16,24,0.94)
        );

      border-color:
        rgba(215,168,79,0.16);

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.18);

    }


    .balance-label {

      color:
        var(--text-3);

      font-size: 10px;

      font-weight: 800;

      letter-spacing:
        .1em;

      text-transform:
        uppercase;

    }


    .balance-number {

      margin-top: 7px;

      color:
        var(--accent);

      font-size: 31px;

      font-weight: 850;

      letter-spacing:
        -0.035em;

    }


    body.theme-mixing-after-dark
    .balance-number {

      text-shadow:
        0 0 22px
        rgba(215,168,79,0.16);

    }


    /* ==========================================
       SECTION TITLE
    ========================================== */

    .section-title {

      margin:
        30px 0 13px;

      font-size: 14px;

      font-weight: 800;

    }


    body.theme-mixing-after-dark
    .section-title {

      color:
        #eee3e8;

    }


    /* ==========================================
       STAT GRID
    ========================================== */

    .stats-grid {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 12px;

    }


    .stat-card {

      padding: 18px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 12px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease,
        transform .15s ease;

    }


    body.theme-mixing-after-dark
    .stat-card {

      background:

        linear-gradient(
          145deg,
          rgba(35,22,34,0.94),
          rgba(20,13,20,0.96)
        );

      border-color:
        rgba(215,168,79,0.11);

    }


    body.theme-mixing-after-dark
    .stat-card:hover {

      transform:
        translateY(-2px);

      border-color:
        rgba(215,168,79,0.22);

      box-shadow:
        0 10px 28px
        rgba(0,0,0,0.20);

    }


    .stat-label {

      color:
        var(--text-3);

      font-size: 10px;

      font-weight: 800;

      letter-spacing:
        .07em;

      text-transform:
        uppercase;

    }


    .stat-value {

      margin-top: 8px;

      font-size: 20px;

      font-weight: 800;

      letter-spacing:
        -0.02em;

    }


    .stat-value.success {

      color:
        var(--success);

    }


    .stat-value.danger {

      color:
        var(--danger);

    }


    .stat-value.accent {

      color:
        var(--accent);

    }


    /* ==========================================
       FINANCIAL STATS
    ========================================== */

    .financial-grid {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 12px;

    }


    .financial-card {

      padding: 20px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 12px;

      transition:
        background .35s ease,
        border-color .35s ease,
        box-shadow .35s ease,
        transform .15s ease;

    }


    body.theme-mixing-after-dark
    .financial-card {

      background:

        linear-gradient(
          145deg,
          rgba(35,22,34,0.94),
          rgba(20,13,20,0.96)
        );

      border-color:
        rgba(215,168,79,0.11);

    }


    body.theme-mixing-after-dark
    .financial-card:hover {

  <script>

    const API_URL =
      "https://api.memplace.xyz";


    let currentUser = null;


    /* ==========================================
       APPLY PAGE THEME
    ========================================== */

    function applyPageTheme(
      equippedTheme
    ) {

      const html =
        document.documentElement;

      const body =
        document.body;


      html.classList.remove(
        "theme-mixing-after-dark"
      );


      body.classList.remove(
        "theme-mixing-after-dark"
      );


      if (
        equippedTheme ===
        "mixing-after-dark"
      ) {

        html.classList.add(
          "theme-mixing-after-dark"
        );

        body.classList.add(
          "theme-mixing-after-dark"
        );

      }

    }


    /* ==========================================
       LOAD STAFF STATUS
    ========================================== */

    async function loadStaffStatus() {

      try {

        const response =
          await fetch(
            API_URL + "/api/admin/me",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        if (!response.ok) {
          return null;
        }


        const data =
          await response.json();


        if (
          !data.success ||
          !data.staff
        ) {

          return null;

        }


        return {

          staff: true,

          role:
            data.role ||
            null

        };

      } catch (error) {

        console.error(
          "STAFF STATUS ERROR:",
          error
        );

        return null;

      }

    }


    /* ==========================================
       LOAD PROFILE
    ========================================== */

    async function loadProfile() {

      const content =
        document.getElementById(
          "content"
        );


      try {

        const response =
          await fetch(
            API_URL + "/api/user/me",
            {
              method: "GET",
              credentials: "include",
              cache: "no-store"
            }
          );


        const data =
          await response.json();


        if (
          response.status === 401 ||
          !data.authenticated ||
          !data.user
        ) {

          applyPageTheme(null);

          showLoginRequired();

          return;

        }


        if (
          !response.ok ||
          !data.success
        ) {

          throw new Error(
            data.error ||
            "Failed to load profile."
          );

        }


        currentUser =
          data.user;


        /* ==========================================
           APPLY FULL PAGE THEME
        ========================================== */

        applyPageTheme(
          currentUser.equippedTheme
        );


        const staffStatus =
          await loadStaffStatus();


        currentUser.isStaff =
          !!staffStatus;


        currentUser.staffRole =
          staffStatus?.role ||
          null;


        updateHeader(
          currentUser
        );


        renderProfile(
          currentUser
        );


      } catch (error) {

        console.error(
          "PROFILE LOAD ERROR:",
          error
        );


        content.innerHTML = `

          <div class="error">
            Failed to load your profile.
          </div>

        `;

      }

    }


    /* ==========================================
       HEADER
    ========================================== */

    function updateHeader(user) {

      document
        .getElementById("loginButton")
        .style.display =
          "none";


      document
        .getElementById("userButton")
        .style.display =
          "flex";


      document
        .getElementById("headerUsername")
        .textContent =
          user.username ||
          user.discordUsername ||
          "User";


      document
        .getElementById("headerBalance")
        .textContent =
          Number(
            user.balance || 0
          ).toLocaleString();


      if (
        user.id &&
        user.avatar
      ) {

        const avatar =
          "https://cdn.discordapp.com/avatars/" +
          encodeURIComponent(user.id) +
          "/" +
          encodeURIComponent(user.avatar) +
          ".png?size=64";


        document
          .getElementById(
            "headerAvatar"
          )
          .src =
            avatar;

      }

    }


    /* ==========================================
       GET NAMEPLATE
    ========================================== */

    function getNameplate(
      equippedNameplate
    ) {

      switch (
        equippedNameplate
      ) {

        case "gold-nameplate":

          return {

            className:
              "gold",

            label:
              "Gold Nameplate",

            icon:
              "✦"

          };


        case "royal-nameplate":

          return {

            className:
              "royal",

            label:
              "Royal Nameplate",

            icon:
              "♛"

          };


        case "diamond-nameplate":

          return {

            className:
              "diamond",

            label:
              "Diamond Nameplate",

            icon:
              "◆"

          };


        default:

          return null;

      }

    }


/* ==========================================
   GET PROFILE TITLE
========================================== */

function getProfileTitle(
  equippedTitle
) {

  switch (
    equippedTitle
  ) {

    case "the-mixing-legend":

      return {

        label:
          "The Mixing Legend",

        icon:
          "✦"

      };


    case "legendary-title":

      return {

        label:
          "Legendary",

        icon:
          "✦"

      };


    default:

      return null;

  }

}


    /* ==========================================
       GET PROFILE THEME
    ========================================== */

    function getProfileTheme(
      equippedTheme
    ) {

      switch (
        equippedTheme
      ) {

        case "mixing-after-dark":

          return {

            className:
              "theme-mixing-after-dark",

            label:
              "Mixing After Dark",

            icon:
              "🌙"

          };


        default:

          return null;

      }

    }


    /* ==========================================
       GET EQUIPPED BADGE
    ========================================== */

    function getBadge(
      equippedBadge
    ) {

      if (
        equippedBadge ===
        "champion-badge"
      ) {

        return {

          image:
            "/championbadge.png",

          label:
            "Champion Badge"

        };

      }


      return null;

    }


    /* ==========================================
       GET STAFF BADGE
    ========================================== */

    function getStaffBadge(user) {

      if (
        !user ||
        !user.isStaff
      ) {

        return null;

      }


      return {

        image:
          "/staffbadge.png",

        label:
          "Staff"

      };

    }


    /* ==========================================
       RENDER PROFILE
    ========================================== */

    function renderProfile(user) {

      const content =
        document.getElementById(
          "content"
        );


      const username =
        escapeHtml(
          user.username ||
          user.discordUsername ||
          "User"
        );


      const discordUsername =
        escapeHtml(
          user.discordUsername ||
          user.username ||
          "Unknown"
        );


      const balance =
        Number(
          user.balance || 0
        ).toLocaleString();


      const gamesPlayed =
        Number(
          user.gamesPlayed || 0
        );


      const gamesWon =
        Number(
          user.gamesWon || 0
        );


      const gamesLost =
        Number(
          user.gamesLost || 0
        );


      const totalWagered =
        Number(
          user.totalWagered || 0
        );


      const totalWon =
        Number(
          user.totalWon || 0
        );


      const totalLost =
        Number(
          user.totalLost || 0
        );


      const chessRating =
        Number(
          user.chessRating || 1200
        );


      /* ==========================================
         COSMETICS
      ========================================== */

      const nameplate =
        getNameplate(
          user.equippedNameplate
        );


      const title =
        getProfileTitle(
          user.equippedTitle
        );


      const theme =
        getProfileTheme(
          user.equippedTheme
        );


      const badge =
        getBadge(
          user.equippedBadge
        );


      const staffBadge =
        getStaffBadge(
          user
        );


      /* ==========================================
         PROFILE CARD CLASSES
      ========================================== */

      const profileClasses = [
        "profile-card"
      ];


      if (nameplate) {

        profileClasses.push(
          `nameplate-${nameplate.className}`
        );

      }


      if (theme) {

        profileClasses.push(
          theme.className
        );

      }


      const profileCardClass =
        profileClasses.join(" ");


      const profileNameClass =
        nameplate
          ? `profile-name ${nameplate.className}`
          : "profile-name";


      const totalDecided =
        gamesWon +
        gamesLost;


      const winRate =
        totalDecided > 0

          ? Math.round(
              (
                gamesWon /
                totalDecided
              ) * 100
            )

          : 0;


      /* ==========================================
         AVATAR
      ========================================== */

      const avatar =
        user.id &&
        user.avatar

          ? `

            <img
              id="profileAvatar"
              class="profile-avatar"
              src="https://cdn.discordapp.com/avatars/${encodeURIComponent(user.id)}/${encodeURIComponent(user.avatar)}.png?size=256"
              alt="${username}"
            >

          `

          : `

            <div
              id="profileAvatar"
              class="profile-avatar"
              style="
                display:grid;
                place-items:center;
                font-size:28px;
                font-weight:800;
              "
            >

              ${escapeHtml(
                username
                  .charAt(0)
                  .toUpperCase()
              )}

            </div>

          `;


      /* ==========================================
         STAFF BADGE
      ========================================== */

      const staffBadgeHtml =
        staffBadge

          ? `

            <div
              class="profile-badge staff"
              title="${escapeHtml(
                staffBadge.label
              )}"
            >

              <img
                src="/staffbadge.png"
                alt="Staff"
              >

            </div>

          `

          : "";


      /* ==========================================
         EQUIPPED BADGE
      ========================================== */

      const badgeHtml =
        badge

          ? `

            <div
              class="profile-badge"
              title="${escapeHtml(
                badge.label
              )}"
            >

              <img
                src="${escapeHtml(
                  badge.image
                )}"
                alt="${escapeHtml(
                  badge.label
                )}"
              >

            </div>

          `

          : "";


      /* ==========================================
         ALL PROFILE BADGES
      ========================================== */

      const profileBadgesHtml =
        (
          staffBadgeHtml ||
          badgeHtml
        )

          ? `

            <div class="profile-badges">

              ${staffBadgeHtml}

              ${badgeHtml}

            </div>

          `

          : "";


      /* ==========================================
         EQUIPPED ITEMS
      ========================================== */

      let equippedHtml = "";


      if (title) {

        equippedHtml += `

          <div class="equipped-item">

            <span class="equipped-item-icon">
              ${escapeHtml(
                title.icon
              )}
            </span>

            ${escapeHtml(
              title.label
            )}

          </div>

        `;

      }


      if (theme) {

        equippedHtml += `

          <div class="equipped-item">

            <span class="equipped-item-icon">
              ${escapeHtml(
                theme.icon
              )}
            </span>

            ${escapeHtml(
              theme.label
            )}

          </div>

        `;

      }


      if (nameplate) {

        equippedHtml += `

          <div class="equipped-item">

            <span class="equipped-item-icon">
              ${escapeHtml(
                nameplate.icon
              )}
            </span>

            ${escapeHtml(
              nameplate.label
            )}

          </div>

        `;

      }


      if (badge) {

        equippedHtml += `

          <div class="equipped-item">

            <span class="equipped-item-icon">
              ♛
            </span>

            ${escapeHtml(
              badge.label
            )}

          </div>

        `;

      }


      if (staffBadge) {

        equippedHtml += `

          <div class="equipped-item">

            <span class="equipped-item-icon">
              ✓
            </span>

            Staff

          </div>

        `;

      }


      const equippedSection =
        equippedHtml

          ? `

            <div class="equipped-display">

              ${equippedHtml}

            </div>

          `

          : "";


      /* ==========================================
         PROFILE TITLE DISPLAY
      ========================================== */

      const profileTitleHtml =
        title

          ? `

            <div class="profile-title">

              <span class="profile-title-icon">
                ${escapeHtml(
                  title.icon
                )}
              </span>

              ${escapeHtml(
                title.label
              )}

            </div>

          `

          : "";


      /* ==========================================
         HTML
      ========================================== */

      content.innerHTML = `

        <section class="page-header">

          <div class="eyebrow">
            Middle Eastern Mixing
          </div>

          <h1>
            Profile
          </h1>

          <p class="description">
            Your account, game statistics, and
            current progress.
          </p>

        </section>


        <!-- ======================================
             PROFILE
        ======================================= -->

        <section
          class="${profileCardClass}"
        >

          ${avatar}


          <div class="profile-info">

            <h2
              class="${profileNameClass}"
            >
              ${username}
            </h2>


            ${profileTitleHtml}


            <div class="profile-discord">
              @${discordUsername}
            </div>


            <div class="profile-id">
              ID: ${escapeHtml(
                user.id || "—"
              )}
            </div>


            ${equippedSection}

          </div>


          ${profileBadgesHtml}

        </section>


        <!-- ======================================
             BALANCE
        ======================================= -->

        <section class="balance-card">

          <div class="balance-label">
            Current Balance
          </div>


          <div class="balance-number">
            ◆ ${balance}
          </div>

        </section>


        <!-- ======================================
             GAME STATS
        ======================================= -->

        <div class="section-title">
          Game Statistics
        </div>


        <section class="stats-grid">


          <div class="stat-card">

            <div class="stat-label">
              Games Played
            </div>

            <div class="stat-value">
              ${gamesPlayed}
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              Games Won
            </div>

            <div class="stat-value success">
              ${gamesWon}
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              Games Lost
            </div>

            <div class="stat-value danger">
              ${gamesLost}
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-label">
              Win Rate
            </div>

            <div class="stat-value accent">
              ${winRate}%
            </div>

          </div>


        </section>


        <!-- ======================================
             ECONOMY
        ======================================= -->

        <div class="section-title">
          Economy
        </div>


        <section class="financial-grid">


          <div class="financial-card">

            <div class="financial-label">
              Total Wagered
            </div>

            <div class="financial-value">
              ◆ ${totalWagered.toLocaleString()}
            </div>

          </div>


          <div class="financial-card">

            <div class="financial-label">
              Total Won
            </div>

            <div class="financial-value accent">
              ◆ ${totalWon.toLocaleString()}
            </div>

          </div>


          <div class="financial-card">

            <div class="financial-label">
              Total Lost
            </div>

            <div class="financial-value">
              ◆ ${totalLost.toLocaleString()}
            </div>

          </div>


        </section>


        <!-- ======================================
             CHESS
        ======================================= -->

        <div class="section-title">
          Chess
        </div>


        <section class="chess-card">


          <div class="chess-left">

            <div class="chess-icon">
              ♟
            </div>


            <div>

              <div class="chess-title">
                Chess Rating
              </div>

              <div class="chess-subtitle">
                Current ELO rating
              </div>

            </div>

          </div>


          <div class="chess-rating">
            ${chessRating}
          </div>


        </section>


        <!-- ======================================
             ACTIONS
        ======================================= -->

        <div class="actions">


          <a
            href="/games"
            class="action-button primary"
          >
            Play a Game
          </a>


          <a
            href="/inventory"
            class="action-button"
          >
            Open Inventory
          </a>


          <a
            href="/leaderboard"
            class="action-button"
          >
            View Leaderboard
          </a>


        </div>

      `;

    }


    /* ==========================================
       LOGIN REQUIRED
    ========================================== */

    function showLoginRequired() {

      const content =
        document.getElementById(
          "content"
        );


      content.innerHTML = `

        <section class="page-header">

          <div class="eyebrow">
            Middle Eastern Mixing
          </div>

          <h1>
            Profile
          </h1>

        </section>


        <div class="login-required">

          <div>
            You need to log in to view your profile.
          </div>


          <a
            href="https://api.memplace.xyz/api/auth/login"
          >
            Login with Discord
          </a>

        </div>

      `;

    }


    /* ==========================================
       HTML ESCAPE
    ========================================== */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* ==========================================
       INIT
    ========================================== */

    loadProfile();


    /* ==========================================
       REFRESH PROFILE
    ========================================== */

    setInterval(
      loadProfile,
      10000
    );

  </script>

</body>
</html>
