<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>History — Middle Eastern Mixing</title>

<style>

:root {
  --black: #0b0a08;
  --surface: #191611;
  --surface-2: #211d17;

  --border: rgba(255,255,255,.08);

  --text: #f4eee5;
  --muted: #9d958b;

  --accent: #d5b36a;
  --success: #76c893;
  --danger: #d96b6b;

  --radius: 16px;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  background:
    radial-gradient(
      circle at top,
      rgba(213,179,106,.08),
      transparent 38%
    ),
    var(--black);

  color: var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

/* ==========================================
   HEADER
========================================== */

header {
  height: 72px;

  position: sticky;
  top: 0;
  z-index: 20;

  border-bottom:
    1px solid var(--border);

  background:
    rgba(11,10,8,.88);

  backdrop-filter:
    blur(18px);
}

.header-inner {
  max-width: 1200px;

  height: 100%;

  margin: 0 auto;

  padding: 0 24px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 24px;
}

.brand {
  display: flex;
  align-items: center;

  gap: 12px;

  font-weight: 700;
}

.brand img {
  width: 38px;
  height: 38px;

  border-radius: 10px;

  object-fit: cover;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.brand-title {
  font-size: 14px;
}

.brand-subtitle {
  color: var(--muted);
  font-size: 11px;
}

nav {
  display: flex;
  align-items: center;
  gap: 6px;
}

nav a {
  padding: 9px 12px;

  border-radius: 10px;

  color: var(--muted);

  font-size: 13px;
}

nav a:hover,
nav a.active {
  color: var(--text);

  background:
    rgba(255,255,255,.05);
}

.account {
  display: flex;
  align-items: center;

  gap: 10px;
}

.balance {
  display: flex;
  align-items: center;

  gap: 7px;

  padding: 8px 12px;

  border:
    1px solid var(--border);

  border-radius: 10px;

  background:
    rgba(255,255,255,.03);

  font-size: 13px;

  font-weight: 600;
}

.coin {
  color: var(--accent);
}

.login-btn,
.profile-btn {
  padding: 9px 13px;

  border-radius: 10px;

  border:
    1px solid var(--border);

  background:
    var(--surface);

  color: var(--text);

  font-size: 13px;
}

.profile-btn {
  display: flex;
  align-items: center;
  gap: 8px;
}

.profile-btn img {
  width: 24px;
  height: 24px;

  border-radius: 50%;

  object-fit: cover;
}

/* ==========================================
   MAIN
========================================== */

main {
  max-width: 1000px;

  margin: 0 auto;

  padding: 55px 24px 80px;
}

.heading {
  margin-bottom: 30px;
}

.eyebrow {
  color: var(--accent);

  font-size: 11px;

  font-weight: 700;

  text-transform: uppercase;

  letter-spacing: .14em;

  margin-bottom: 9px;
}

h1 {
  margin: 0;

  font-size:
    clamp(32px, 5vw, 46px);

  letter-spacing: -.04em;
}

.heading p {
  margin: 11px 0 0;

  color: var(--muted);

  font-size: 14px;

  line-height: 1.6;
}

/* ==========================================
   HISTORY
========================================== */

.history-card {
  overflow: hidden;

  border:
    1px solid var(--border);

  border-radius: var(--radius);

  background:
    var(--surface);
}

.history-row {
  display: grid;

  grid-template-columns:
    52px minmax(0, 1fr)
    auto auto;

  align-items: center;

  gap: 15px;

  padding: 18px 20px;

  border-bottom:
    1px solid var(--border);
}

.history-row:last-child {
  border-bottom: 0;
}

.history-icon {
  width: 42px;
  height: 42px;

  display: grid;
  place-items: center;

  border-radius: 12px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid var(--border);

  font-size: 19px;
}

.history-main {
  min-width: 0;
}

.history-game {
  font-size: 14px;

  font-weight: 700;
}

.history-details {
  margin-top: 4px;

  color: var(--muted);

  font-size: 12px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}

.history-result {
  padding: 5px 9px;

  border-radius: 8px;

  background:
    rgba(255,255,255,.04);

  color: var(--muted);

  font-size: 11px;

  font-weight: 700;
}

.history-result.won,
.history-result.correct,
.history-result.claimed {
  color: var(--success);

  background:
    rgba(118,200,147,.08);
}

.history-result.lost,
.history-result.incorrect {
  color: var(--danger);

  background:
    rgba(217,107,107,.08);
}

.history-amount {
  min-width: 95px;

  text-align: right;

  font-size: 14px;

  font-weight: 800;
}

.history-amount.positive {
  color: var(--success);
}

.history-amount.negative {
  color: var(--danger);
}

.history-amount.neutral {
  color: var(--muted);
}

.history-time {
  color: var(--muted);

  font-size: 11px;

  margin-top: 4px;

  text-align: right;
}

/* ==========================================
   EMPTY
========================================== */

.empty {
  padding: 70px 25px;

  text-align: center;

  color: var(--muted);
}

.empty strong {
  display: block;

  margin-bottom: 7px;

  color: var(--text);
}

/* ==========================================
   PAGINATION
========================================== */

.pagination {
  display: flex;

  justify-content: center;

  align-items: center;

  gap: 12px;

  margin-top: 22px;
}

.page-btn {
  padding: 10px 15px;

  border:
    1px solid var(--border);

  border-radius: 10px;

  background:
    var(--surface);

  color: var(--text);

  cursor: pointer;

  font-size: 13px;
}

.page-btn:disabled {
  opacity: .4;

  cursor: not-allowed;
}

.page-number {
  color: var(--muted);

  font-size: 13px;
}

/* ==========================================
   LOGIN
========================================== */

.login-state {
  padding: 60px 25px;

  text-align: center;

  border:
    1px solid var(--border);

  border-radius: var(--radius);

  background:
    var(--surface);
}

.login-state h2 {
  margin: 0;
}

.login-state p {
  color: var(--muted);

  line-height: 1.6;
}

.login-state a {
  display: inline-block;

  margin-top: 10px;

  padding: 11px 17px;

  border-radius: 10px;

  background:
    var(--accent);

  color: #17130d;

  font-size: 13px;

  font-weight: 700;
}

/* ==========================================
   RESPONSIVE
========================================== */

@media (max-width: 800px) {

  nav {
    display: none;
  }

  .history-row {
    grid-template-columns:
      45px minmax(0, 1fr) auto;
  }

  .history-result {
    display: none;
  }

}

@media (max-width: 560px) {

  .header-inner {
    padding: 0 15px;
  }

  .brand-subtitle {
    display: none;
  }

  .balance {
    display: none;
  }

  main {
    padding:
      40px 15px 65px;
  }

  .history-row {
    grid-template-columns:
      42px minmax(0, 1fr);

    gap: 12px;
  }

  .history-amount {
    grid-column: 2;

    text-align: left;
  }

}

</style>

</head>

<body>

<header>

  <div class="header-inner">

    <a
      href="/"
      class="brand"
    >

      <img
        src="/logo.gif"
        alt=""
      >

      <div class="brand-text">

        <div class="brand-title">
          Middle Eastern Mixing
        </div>

        <div class="brand-subtitle">
          Minigames
        </div>

      </div>

    </a>


    <nav>

      <a href="/games">
        Games
      </a>

      <a href="/leaderboard">
        Leaderboard
      </a>

      <a href="/shop">
        Shop
      </a>

      <a href="/daily">
        Daily
      </a>

      <a
        href="/history"
        class="active"
      >
        History
      </a>

    </nav>


    <div
      class="account"
      id="account"
    >

      <a
        class="login-btn"
        href="https://api.memplace.xyz/api/auth/login"
      >
        Login
      </a>

    </div>

  </div>

</header>


<main>

  <section class="heading">

    <div class="eyebrow">
      Activity
    </div>

    <h1>
      History
    </h1>

    <p>
      View your recent games, rewards,
      purchases and other activity.
    </p>

  </section>


  <section
    id="historyContainer"
  >

    <div class="history-card">

      <div class="empty">
        Loading history...
      </div>

    </div>

  </section>


  <div
    class="pagination"
    id="pagination"
  ></div>

</main>


<script>

const API =
  "https://api.memplace.xyz";

let currentPage = 1;

let totalPages = 1;


/* ==========================================
   ELEMENTS
========================================== */

const account =
  document.getElementById(
    "account"
  );

const historyContainer =
  document.getElementById(
    "historyContainer"
  );

const pagination =
  document.getElementById(
    "pagination"
  );


/* ==========================================
   ESCAPE
========================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* ==========================================
   USER
========================================== */

async function loadUser() {

  try {

    const response =
      await fetch(
        `${API}/api/user/me`,
        {
          credentials: "include",
          cache: "no-store"
        }
      );

    if (!response.ok) {
      return false;
    }

    const data =
      await response.json();

    if (
      !data.success ||
      !data.authenticated ||
      !data.user
    ) {
      return false;
    }

    currentUser =
      data.user;

    renderAccount();

    return true;

  } catch (error) {

    console.error(
      "USER ERROR:",
      error
    );

    return false;

  }

}


function renderAccount() {

  const avatar =
    currentUser.avatar
      ? `https://cdn.discordapp.com/avatars/${encodeURIComponent(currentUser.id)}/${encodeURIComponent(currentUser.avatar)}.png?size=64`
      : "/logo.gif";

  account.innerHTML = `

    <div class="balance">

      <span class="coin">
        ◆
      </span>

      <span>
        ${Number(
          currentUser.balance || 0
        ).toLocaleString()}
      </span>

    </div>

    <a
      class="profile-btn"
      href="/profile"
    >

      <img
        src="${avatar}"
        alt=""
      >

      <span>
        ${escapeHtml(
          currentUser.username ||
          currentUser.discordUsername ||
          "Profile"
        )}
      </span>

    </a>

  `;

}


/* ==========================================
   LOGIN
========================================== */

function renderLogin() {

  historyContainer.innerHTML = `

    <div class="login-state">

      <h2>
        Sign in to view your history
      </h2>

      <p>
        Your game activity, rewards and
        purchases are linked to your account.
      </p>

      <a
        href="${API}/api/auth/login"
      >
        Login with Discord
      </a>

    </div>

  `;

  pagination.innerHTML = "";

}


/* ==========================================
   FORMAT DATE
========================================== */

function formatDate(value) {

  if (!value) {
    return "Unknown date";
  }

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    return "Unknown date";
  }

  return date.toLocaleString(
    undefined,
    {
      month: "short",
      day: "numeric",
      year: "numeric",
      hour: "numeric",
      minute: "2-digit"
    }
  );

}


/* ==========================================
   FORMAT AMOUNT
========================================== */

function formatAmount(amount) {

  const value =
    Number(amount || 0);

  if (value > 0) {

    return {
      text:
        `+◆ ${value.toLocaleString()}`,
      className:
        "positive"
    };

  }

  if (value < 0) {

    return {
      text:
        `-◆ ${Math.abs(value).toLocaleString()}`,
      className:
        "negative"
    };

  }

  return {
    text: "—",
    className: "neutral"
  };

}


/* ==========================================
   RESULT CLASS
========================================== */

function resultClass(result) {

  const value =
    String(result || "")
      .toLowerCase();

  if (
    value === "won" ||
    value === "correct" ||
    value === "claimed"
  ) {
    return value;
  }

  if (
    value === "lost" ||
    value === "incorrect"
  ) {
    return value;
  }

  return "";

}


/* ==========================================
   LOAD HISTORY
========================================== */

async function loadHistory(page = 1) {

  historyContainer.innerHTML = `

    <div class="history-card">

      <div class="empty">
        Loading history...
      </div>

    </div>

  `;


  try {

    const response =
      await fetch(
        `${API}/api/history?page=${page}`,
        {
          credentials: "include",
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    if (
      response.status === 401
    ) {

      renderLogin();

      return;

    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Unable to load history."
      );

    }


    currentPage =
      Number(
        data.page || page
      );

    totalPages =
      Number(
        data.totalPages || 1
      );


    renderHistory(
      data.history || []
    );

    renderPagination();

  } catch (error) {

    console.error(
      "HISTORY LOAD ERROR:",
      error
    );

    historyContainer.innerHTML = `

      <div class="history-card">

        <div class="empty">

          <strong>
            Unable to load history
          </strong>

          Please refresh the page
          and try again.

        </div>

      </div>

    `;

    pagination.innerHTML = "";

  }

}


/* ==========================================
   RENDER HISTORY
========================================== */

function renderHistory(history) {

  if (!history.length) {

    historyContainer.innerHTML = `

      <div class="history-card">

        <div class="empty">

          <strong>
            No activity yet
          </strong>

          Your games, rewards and purchases
          will appear here.

        </div>

      </div>

    `;

    return;

  }


  historyContainer.innerHTML = `

    <div class="history-card">

      ${history.map(entry => {

        const amount =
          formatAmount(
            entry.amount
          );

        const result =
          resultClass(
            entry.result
          );

        return `

          <div class="history-row">

            <div class="history-icon">
              ${escapeHtml(
                entry.icon || "•"
              )}
            </div>


            <div class="history-main">

              <div class="history-game">
                ${escapeHtml(
                  entry.game ||
                  "Activity"
                )}
              </div>

              <div class="history-details">
                ${escapeHtml(
                  entry.details ||
                  ""
                )}
              </div>

            </div>


            <div>

              <div
                class="history-result ${result}"
              >
                ${escapeHtml(
                  entry.result ||
                  "Activity"
                )}
              </div>

              <div class="history-time">
                ${escapeHtml(
                  formatDate(
                    entry.timestamp
                  )
                )}
              </div>

            </div>


            <div
              class="history-amount ${amount.className}"
            >
              ${escapeHtml(
                amount.text
              )}
            </div>

          </div>

        `;

      }).join("")}

    </div>

  `;

}


/* ==========================================
   PAGINATION
========================================== */

function renderPagination() {

  if (
    totalPages <= 1
  ) {

    pagination.innerHTML = "";

    return;

  }


  pagination.innerHTML = `

    <button
      class="page-btn"
      id="previousPage"
      ${currentPage <= 1 ? "disabled" : ""}
    >
      Previous
    </button>

    <div class="page-number">
      Page ${currentPage}
      of ${totalPages}
    </div>

    <button
      class="page-btn"
      id="nextPage"
      ${currentPage >= totalPages ? "disabled" : ""}
    >
      Next
    </button>

  `;


  document
    .getElementById(
      "previousPage"
    )
    ?.addEventListener(
      "click",
      () => {

        if (
          currentPage > 1
        ) {

          loadHistory(
            currentPage - 1
          );

        }

      }
    );


  document
    .getElementById(
      "nextPage"
    )
    ?.addEventListener(
      "click",
      () => {

        if (
          currentPage <
          totalPages
        ) {

          loadHistory(
            currentPage + 1
          );

        }

      }
    );

}


/* ==========================================
   INIT
========================================== */

async function init() {

  const authenticated =
    await loadUser();

  if (!authenticated) {

    renderLogin();

    return;

  }

  await loadHistory(1);

}


init();

</script>

</body>

</html>
