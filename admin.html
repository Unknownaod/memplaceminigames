<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard — Middle Eastern Mixing</title>

  <style>

    :root {
      --black: #0b0a08;
      --black-2: #12100d;
      --surface: #191511;
      --surface-2: #211c16;

      --border: rgba(255,255,255,0.07);

      --text: #f1ece4;
      --muted: #968f84;

      --accent: #d6a85c;
      --accent-soft: rgba(214,168,92,0.12);

      --danger: #d96b6b;
      --success: #6fbd88;
    }


    * {
      box-sizing: border-box;
    }


    html {
      background: var(--black);
    }


    body {
      margin: 0;

      min-height: 100vh;

      background:
        radial-gradient(
          circle at top,
          rgba(214,168,92,0.055),
          transparent 30%
        ),
        var(--black);

      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    /* ==========================================
       HEADER
    ========================================== */

    .header {
      position: sticky;

      top: 0;

      z-index: 20;

      height: 72px;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(11,10,8,0.82);

      backdrop-filter:
        blur(18px);
    }


    .header-inner {
      width:
        min(
          1180px,
          calc(100% - 40px)
        );

      height: 100%;

      margin: 0 auto;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }


    .brand {
      display: flex;

      align-items: center;

      gap: 11px;

      font-weight: 700;

      letter-spacing: -0.02em;
    }


    .brand img {
      width: 34px;

      height: 34px;

      border-radius: 9px;

      object-fit: cover;
    }


    .brand-text {
      display: flex;

      flex-direction: column;

      gap: 2px;
    }


    .brand-title {
      font-size: 14px;
    }


    .brand-subtitle {
      color: var(--accent);

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 0.12em;
    }


    .back-link {
      color: var(--muted);

      font-size: 13px;

      transition:
        color 0.2s ease;
    }


    .back-link:hover {
      color: var(--text);
    }


    /* ==========================================
       PAGE
    ========================================== */

    .page {
      width:
        min(
          1180px,
          calc(100% - 40px)
        );

      margin: 0 auto;

      padding:
        46px 0 80px;
    }


    .eyebrow {
      color: var(--accent);

      font-size: 11px;

      font-weight: 700;

      letter-spacing: 0.14em;

      text-transform: uppercase;

      margin-bottom: 9px;
    }


    h1 {
      margin: 0;

      font-size:
        clamp(
          28px,
          4vw,
          40px
        );

      letter-spacing: -0.035em;
    }


    .intro {
      margin:
        10px 0 0;

      max-width: 650px;

      color: var(--muted);

      line-height: 1.6;

      font-size: 14px;
    }


    /* ==========================================
       STAFF BAR
    ========================================== */

    .staff-bar {
      margin-top: 28px;

      padding:
        16px 18px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          rgba(214,168,92,0.08),
          rgba(255,255,255,0.015)
        );

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }


    .staff-user {
      display: flex;

      align-items: center;

      gap: 12px;
    }


    .staff-avatar {
      width: 40px;

      height: 40px;

      border-radius: 50%;

      background: var(--surface-2);

      object-fit: cover;
    }


    .staff-name {
      font-size: 14px;

      font-weight: 700;
    }


    .staff-role {
      margin-top: 3px;

      color: var(--accent);

      font-size: 10px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.1em;
    }


    /* ==========================================
       SECTIONS
    ========================================== */

    .section-title {
      margin:
        38px 0 14px;

      font-size: 12px;

      font-weight: 700;

      color: var(--muted);

      text-transform: uppercase;

      letter-spacing: 0.1em;
    }


    /* ==========================================
       ADMIN GRID
    ========================================== */

    .admin-grid {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 14px;
    }


    .admin-card {
      position: relative;

      min-height: 150px;

      padding: 21px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        var(--surface);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }


    a.admin-card:hover {
      transform:
        translateY(-2px);

      border-color:
        rgba(214,168,92,0.28);

      background:
        linear-gradient(
          145deg,
          var(--surface-2),
          var(--surface)
        );
    }


    .admin-card-icon {
      width: 40px;

      height: 40px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 11px;

      background:
        var(--accent-soft);

      color:
        var(--accent);

      margin-bottom: 17px;

      font-size: 18px;
    }


    .admin-card h2 {
      margin: 0;

      font-size: 15px;

      letter-spacing: -0.01em;
    }


    .admin-card p {
      margin:
        7px 0 0;

      color:
        var(--muted);

      font-size: 12px;

      line-height: 1.5;

      max-width: 270px;
    }


    .card-arrow {
      position: absolute;

      right: 20px;

      top: 22px;

      color:
        var(--muted);

      font-size: 15px;
    }


    .locked {
      opacity: 0.38;

      pointer-events: none;
    }


    .locked-badge {
      position: absolute;

      right: 17px;

      bottom: 17px;

      padding:
        4px 7px;

      border-radius: 6px;

      background:
        rgba(255,255,255,0.05);

      color:
        var(--muted);

      font-size: 9px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.08em;
    }


    /* ==========================================
       SYSTEM STATUS
    ========================================== */

    .system-status {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 14px;

      margin-top: 14px;
    }


    .status-card {
      padding: 18px;

      border:
        1px solid var(--border);

      border-radius: 14px;

      background:
        var(--surface);
    }


    .status-label {
      color:
        var(--muted);

      font-size: 11px;
    }


    .status-value {
      margin-top: 8px;

      font-size: 14px;

      font-weight: 700;
    }


    .online {
      color:
        var(--success);
    }


    /* ==========================================
       LOADING
    ========================================== */

    .loading {
      width:
        min(
          1180px,
          calc(100% - 40px)
        );

      margin: 0 auto;

      padding:
        100px 0;

      text-align: center;

      color:
        var(--muted);

      font-size: 14px;
    }


    /* ==========================================
       ERROR
    ========================================== */

    .error {
      width:
        min(
          600px,
          calc(100% - 40px)
        );

      margin:
        100px auto;

      padding: 26px;

      border:
        1px solid
        rgba(217,107,107,0.2);

      border-radius: 14px;

      background:
        rgba(217,107,107,0.05);

      text-align: center;
    }


    .error h2 {
      margin:
        0 0 8px;

      font-size: 18px;
    }


    .error p {
      margin: 0;

      color:
        var(--muted);

      font-size: 13px;

      line-height: 1.5;
    }


    /* ==========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 900px) {

      .admin-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

      .system-status {
        grid-template-columns:
          1fr;
      }

    }


    @media (max-width: 600px) {

      .header-inner,
      .page,
      .loading {
        width:
          calc(100% - 24px);
      }


      .admin-grid {
        grid-template-columns:
          1fr;
      }


      .staff-bar {
        align-items: flex-start;

        flex-direction: column;
      }

    }

  </style>

</head>


<body>


  <!-- ========================================
       HEADER
  ========================================= -->

  <header class="header">

    <div class="header-inner">

      <div class="brand">

        <img
          src="/logo.gif"
          alt=""
        >

        <div class="brand-text">

          <div class="brand-title">
            Middle Eastern Mixing
          </div>

          <div class="brand-subtitle">
            Administration
          </div>

        </div>

      </div>


      <a
        class="back-link"
        href="/"
      >
        ← Back to site
      </a>

    </div>

  </header>


  <!-- ========================================
       APPLICATION
  ========================================= -->

  <main id="app">

    <div class="loading">
      Checking staff access...
    </div>

  </main>


  <script>

    const API =
      "https://api.memplace.xyz";


    /* ==========================================
       LOAD ADMIN
    ========================================== */

    async function loadAdmin() {

      const app =
        document.getElementById("app");


      try {

        const response =
          await fetch(
            API + "/api/admin/me",
            {
              method: "GET",

              credentials: "include",

              cache: "no-store"
            }
          );


        const data =
          await response.json();


        /*
         * Not staff.
         */

        if (
          !response.ok ||
          !data.success ||
          !data.staff
        ) {

          window.location.href = "/";

          return;

        }


        renderAdmin(data);


      } catch (error) {

        console.error(
          "ADMIN LOAD ERROR:",
          error
        );


        app.innerHTML = `

          <div class="error">

            <h2>
              Unable to load admin panel
            </h2>

            <p>
              The administration API could not be reached.
              Please try again later.
            </p>

          </div>

        `;

      }

    }


    /* ==========================================
       RENDER ADMIN
    ========================================== */

    function renderAdmin(data) {

      const app =
        document.getElementById("app");


      const permissions =
        Array.isArray(data.permissions)
          ? data.permissions
          : [];


      const isOwner =
        data.role === "owner";


      function hasPermission(
        permission
      ) {

        return (
          isOwner ||
          permissions.includes(permission)
        );

      }


      /*
       * Discord avatar.
       *
       * admin/me currently only returns
       * staff user information, so we
       * use the site logo for now.
       */

      const avatar =
        "/logo.gif";


      app.innerHTML = `

        <div class="page">


          <div class="eyebrow">
            Staff Console
          </div>


          <h1>
            Admin Dashboard
          </h1>


          <p class="intro">
            Manage Middle Eastern Mixing
            minigames, players, economy,
            support, and system operations.
          </p>


          <!-- STAFF USER -->

          <div class="staff-bar">

            <div class="staff-user">

              <img
                class="staff-avatar"
                src="${avatar}"
                alt=""
              >

              <div>

                <div class="staff-name">
                  ${escapeHtml(
                    data.user?.username ||
                    data.user?.discordUsername ||
                    "Staff"
                  )}
                </div>

                <div class="staff-role">
                  ${escapeHtml(
                    String(data.role || "staff")
                  )}
                </div>

              </div>

            </div>

          </div>


          <!-- MANAGEMENT -->

          <div class="section-title">
            Management
          </div>


          <div class="admin-grid">


            ${adminCard(
              hasPermission("dashboard"),
              "📊",
              "Dashboard",
              "Overview of minigame activity, players, and economy.",
              "/admin"
            )}


            ${adminCard(
              hasPermission("support"),
              "🎫",
              "Support",
              "View, respond to, and manage player support tickets.",
              "/admin/support"
            )}


            ${adminCard(
              hasPermission("users"),
              "👥",
              "Users",
              "Search players and view their minigame accounts.",
              "/admin/users"
            )}


            ${adminCard(
              hasPermission("economy"),
              "🪙",
              "Economy",
              "Manage balances, transactions, rewards, and economy activity.",
              "/admin/economy"
            )}


            ${adminCard(
              hasPermission("games"),
              "🎮",
              "Games",
              "View game activity, matches, wagers, and results.",
              "/admin/games"
            )}


            ${adminCard(
              hasPermission("shop"),
              "🛍️",
              "Shop",
              "Manage shop items, prices, inventory, and purchases.",
              "/admin/shop"
            )}


            ${adminCard(
              hasPermission("daily"),
              "🎁",
              "Daily Rewards",
              "Review daily reward activity and player claims.",
              "/admin/daily"
            )}


            ${adminCard(
              hasPermission("leaderboard"),
              "🏆",
              "Leaderboard",
              "View ranking activity and competitive statistics.",
              "/admin/leaderboard"
            )}


           ${adminCard(
           hasPermission("staff"),
           "🛡️",
           "Staff",
           "Manage staff members, roles, and permissions.",
           "/admin/staff"
           )}


          </div>


          <!-- SYSTEM -->

          <div class="section-title">
            System
          </div>


          <div class="system-status">


            <div class="status-card">

              <div class="status-label">
                API
              </div>

              <div class="status-value online">
                ● Online
              </div>

            </div>


            <div class="status-card">

              <div class="status-label">
                Authentication
              </div>

              <div class="status-value online">
                ● Connected
              </div>

            </div>


            <div class="status-card">

              <div class="status-label">
                Staff Access
              </div>

              <div class="status-value online">
                ● Authorized
              </div>

            </div>


          </div>


        </div>

      `;

    }


    /* ==========================================
       ADMIN CARD
    ========================================== */

    function adminCard(
      enabled,
      icon,
      title,
      description,
      href,
      comingSoon = false
    ) {


      /*
       * Permission denied.
       */

      if (!enabled) {

        return `

          <div class="admin-card locked">

            <div class="admin-card-icon">
              ${icon}
            </div>

            <h2>
              ${title}
            </h2>

            <p>
              ${description}
            </p>

            <div class="locked-badge">
              No Access
            </div>

          </div>

        `;

      }


      /*
       * Permission exists but page
       * hasn't been built yet.
       */

      if (comingSoon) {

        return `

          <div class="admin-card">

            <div class="admin-card-icon">
              ${icon}
            </div>

            <div class="card-arrow">
              →
            </div>

            <h2>
              ${title}
            </h2>

            <p>
              ${description}
            </p>

            <div class="locked-badge">
              Coming Soon
            </div>

          </div>

        `;

      }


      /*
       * Functional page.
       */

      return `

        <a
          class="admin-card"
          href="${href}"
        >

          <div class="admin-card-icon">
            ${icon}
          </div>

          <div class="card-arrow">
            →
          </div>

          <h2>
            ${title}
          </h2>

          <p>
            ${description}
          </p>

        </a>

      `;

    }


    /* ==========================================
       HTML ESCAPING
    ========================================== */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )
        .replaceAll(
          "&",
          "&amp;"
        )
        .replaceAll(
          "<",
          "&lt;"
        )
        .replaceAll(
          ">",
          "&gt;"
        )
        .replaceAll(
          '"',
          "&quot;"
        )
        .replaceAll(
          "'",
          "&#039;"
        );

    }


    /* ==========================================
       START
    ========================================== */

    loadAdmin();

  </script>


</body>

</html>
